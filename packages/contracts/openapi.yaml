openapi: 3.1.0
info:
  title: sig-iso API
  version: 0.1.0
  description: |
    Contrato del corte vertical del paso 0.6: identidad de la persona que consulta, marca de su empresa, librerías de normas
    (catálogo global y adopción por empresa) y requisitos.

    **La empresa nunca la envía el cliente.** Sale únicamente del token verificado; ninguna operación recibe un identificador
    de empresa. Si el token no trae empresa, la solicitud se rechaza.

    **Un solo 404.** Para un recurso que no se puede ver, «no existe», «es de otra empresa» y «la librería no está adoptada»
    producen exactamente la misma respuesta.

    **Orden de evaluación.** Primero la autenticación (401), luego el permiso por rol (403, sin mirar el identificador), luego el
    formato de los parámetros (400) y por último la existencia (404). Así el código de error nunca revela si un identificador existe.

    **Datos personales.** `nombre` solo viaja en `/me` y nunca se escribe en registros técnicos ni en la bitácora (solo el
    identificador opaco).

    Los errores usan `application/problem+json` con un código de una lista cerrada y **sin texto libre** ni datos de la
    solicitud. Las respuestas autenticadas llevan `Cache-Control: no-store`.
servers:
  - url: http://localhost:3001
    description: Desarrollo local
tags:
  - name: salud
    description: Comprobación de disponibilidad
  - name: sesion
    description: Identidad y ciclo de la sesión
  - name: empresa
    description: Datos de la empresa de la persona que consulta
  - name: librerias
    description: Catálogo de librerías de normas y su adopción por la empresa
  - name: requisitos
    description: Entradas de las librerías adoptadas
  - name: personas
    description: Personas de la empresa, solicitudes de acceso y roles
  - name: riesgos
    description: Riesgos mínimos de la empresa y sus vínculos con controles (ADR 037)
  - name: activos
    description: Activos de información de la empresa y su liga con los riesgos (ADR 038)
  - name: documentos
    description: Control documental, versiones, aprobación, lectura confirmada y retención (ADR 039)
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: comprobarSalud
      summary: Comprueba que la API responde
      tags: [salud]
      security: []
      responses:
        '200':
          description: La API responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /me:
    get:
      operationId: obtenerIdentidad
      summary: Identidad de quien consulta
      description: Devuelve la persona, sus roles y su empresa (nombre y slug), tomados del token verificado.
      tags: [sesion]
      responses:
        '200':
          description: Identidad de la persona.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identidad'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/empresas:
    get:
      operationId: listarMisEmpresas
      summary: Las empresas a las que pertenece quien consulta
      description: |
        Una persona puede pertenecer a varias empresas (un consultor), cada una con su propio rol (ADR 035). Solo se listan las suyas,
        con el nombre y el slug (el de la URL `/e/<slug>`), por nombre; `activa` marca la de esta sesión. Quien pertenece a una sola
        empresa recibe una lista de un elemento.
      tags: [sesion]
      responses:
        '200':
          description: Las empresas de la persona.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/EmpresaDePersona'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/empresa:
    post:
      operationId: cambiarEmpresa
      summary: Cambia la empresa activa de la sesión
      description: |
        ÚNICA operación que nombra una empresa (ADR 035). La API toma la persona y la sesión del token verificado y comprueba en la base
        que la persona **pertenece** a la empresa pedida con un rol; si no, responde 404 (igual que una empresa que no existe) y deja un
        `acceso.cruzado`. Si pertenece, registra `empresa.cambiada` en la empresa destino y recién entonces guarda la empresa activa de
        ESA sesión (vence con la sesión máxima, 8 h). Desde la siguiente petición, todo se evalúa con esa empresa y con el rol que la
        persona tiene allí. Ninguna otra operación acepta una empresa del cliente.

        Orden de evaluación: 401, 400 (slug mal formado) y 404 (no pertenece).
      tags: [sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaElegida'
      responses:
        '200':
          description: La empresa activa de la sesión es ahora la pedida.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaActual'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresa/marca:
    get:
      operationId: obtenerMarcaEmpresa
      summary: Marca de la empresa de quien consulta
      description: |
        Solo devuelve la marca de la empresa del token; la de otra empresa no viaja nunca. Si el color de la empresa no cumple el
        contraste mínimo se devuelve el color ajustado y `ajustadoPorContraste` en verdadero. El servidor nunca resuelve `logoUrl`:
        el navegador la carga con `referrerpolicy="no-referrer"` y una política de contenido restrictiva.
      tags: [empresa]
      responses:
        '200':
          description: Marca de la empresa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marca'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: actualizarMarcaEmpresa
      summary: Edita el color y el logo de la empresa de quien consulta
      description: |
        Solo la persona con rol de administrador SIG (`marca.editar`). La empresa y la persona salen del token; el cuerpo solo trae el
        color y el logo. El color elegido se guarda tal cual: si no cumple el contraste mínimo (AA), la marca que se APLICA se ajusta y
        la respuesta lo dice (`ajustadoPorContraste`). El logo es una dirección `https` sin credenciales, una ruta propia o nulo (vuelve
        el monograma); uno no permitido se RECHAZA con 400 (no se descarta en silencio). No cambia el nombre ni el slug. Si no cambia
        nada, responde la marca vigente y no registra nada; si cambia algo, la bitácora guarda solo QUÉ cambió (color, logo), nunca los
        valores. Orden de evaluación: 401, 403, 400.
      tags: [empresa]
      x-permiso: marca.editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarcaEdicion'
      responses:
        '200':
          description: La marca vigente después del cambio.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marca'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/inicio:
    post:
      operationId: registrarInicioSesion
      summary: Registra el inicio de sesión
      description: |
        El hecho se deriva del token verificado, nunca de datos enviados por el cliente, y es idempotente por sesión: repetirlo con
        la misma sesión responde 204 sin escribir otro registro. La sesión del navegador solo se emite cuando este registro se ha
        escrito.
      tags: [sesion]
      responses:
        '204':
          description: Inicio de sesión registrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/cierre:
    post:
      operationId: registrarCierreSesion
      summary: Registra el cierre de sesión
      description: Idempotente por sesión, como el inicio. Un token ya revocado responde 401.
      tags: [sesion]
      responses:
        '204':
          description: Cierre de sesión registrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias:
    get:
      operationId: listarLibrerias
      summary: Librerías del catálogo
      description: |
        Las librerías del catálogo GLOBAL (de solo lectura) y las PROPIAS de la empresa de quien consulta (ADR 034), con sus
        metadatos, e indica cuáles adoptó la empresa. Las entradas solo se ven si se adoptó. Una librería propia de otra empresa
        nunca aparece. Cada versión es una fila.
      tags: [librerias]
      responses:
        '200':
          description: Librerías del catálogo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/LibreriaResumen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias/carga:
    post:
      operationId: cargarLibreria
      summary: Sube una librería de norma propia de la empresa (archivo YAML)
      description: |
        Solo la persona con rol de administrador SIG (`normas.cargar`). `multipart/form-data` con **un solo archivo** (campo `archivo`)
        YAML de hasta 1 MB, sin alias ni anclas, con el esquema v3 de las librerías (sin texto de la norma). El código debe empezar con
        `propia-` y la librería no puede ser de ejemplo. La librería queda **propia de la empresa del token** y nunca es visible para
        otra; cada versión es inmutable (la misma versión con otro contenido se rechaza).

        Un archivo que no pasa la validación **no es un error HTTP**: responde 200 con `estado: rechazada`, el motivo y la lista de
        errores por ruta (nunca el contenido), y el rechazo queda en la bitácora. 201 si se cargó ahora; 200 si ya estaba cargada
        (mismo contenido) o si se rechazó. 413 si declara más de 1 MB (sin leerlo) y 400 si no llega el archivo.
        Orden de evaluación: 401, 403, 400, 413, y después la validación del contenido.
      tags: [librerias]
      x-permiso: normas.cargar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LibreriaSubida'
      responses:
        '201':
          description: La librería se cargó ahora.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaLibreria'
        '200':
          description: Ya estaba cargada (mismo contenido) o el archivo se rechazó; ver `estado`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '413':
          $ref: '#/components/responses/LibreriaDemasiadoGrande'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias/{id}/adopcion:
    post:
      operationId: adoptarLibreria
      summary: Adopta una librería para la empresa
      description: |
        Solo la persona con rol de administrador SIG. No hay cuerpo: la empresa y la persona salen del token. La autorización se
        decide en OpenFGA (relación `administrador_sig` sobre la empresa del token) y se evalúa ANTES de cualquier efecto; los
        rechazos por permiso también se registran en la bitácora.

        Orden de evaluación: 401, 403 (solo por rol, sin mirar el identificador: un colaborador recibe siempre el mismo 403, exista
        o no la librería), 404 (la función está apagada para la empresa por el flag `adopcion-habilitada`: se presenta como una
        operación inexistente, sin importar el identificador), 400 (UUID mal formado) y 404 (no existe). Adoptar una librería ya
        adoptada no es un error: responde 200 sin cambios.
      tags: [librerias]
      x-permiso: administrador_sig
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '201':
          description: Librería adoptada ahora.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adopcion'
        '200':
          description: La librería ya estaba adoptada; no hubo cambios.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adopcion'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /requisitos:
    get:
      operationId: listarRequisitos
      summary: Entradas de las librerías adoptadas
      description: |
        Solo incluye entradas de librerías que la empresa adoptó. Sin adopciones devuelve una lista vacía. Orden: por librería y,
        dentro de cada una, el orden de la librería (el cliente no puede reordenar). El catálogo es acotado por diseño: si
        algún día superara el tope de `maxItems`, se revisará este contrato (paginación) en lugar de truncar sin avisar.
        El servidor usa consultas parametrizadas; los filtros no admiten comodines.
      tags: [requisitos]
      parameters:
        - name: q
          in: query
          required: false
          description: Texto a buscar en el identificador o el título.
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ .:-]+$
        - name: capitulo
          in: query
          required: false
          description: Capítulo de la Estructura Armonizada (4 a 10).
          schema:
            type: integer
            minimum: 4
            maximum: 10
        - name: norma
          in: query
          required: false
          description: Norma a la que aplica la entrada, por ejemplo «ISO 9001».
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: tipo
          in: query
          required: false
          description: Cláusulas (capítulos 4 a 10) o controles del Anexo A.
          schema:
            type: string
            enum: [clausula, control]
      responses:
        '200':
          description: Entradas que cumplen el filtro.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: '#/components/schemas/EntradaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /requisitos/{id}:
    get:
      operationId: obtenerRequisito
      summary: Una entrada de una librería adoptada
      description: 'Orden de evaluación: 401, 400 (UUID mal formado) y 404 (única respuesta para «no existe», «es de otra empresa» y «su librería no está adoptada»).'
      tags: [requisitos]
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '200':
          description: La entrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /alcances:
    get:
      operationId: listarAlcances
      summary: Alcance de cada norma adoptada
      description: Una fila por norma de las librerías adoptadas; el alcance no definido llega con `texto` nulo.
      tags: [alcance]
      x-permiso: alcance.ver
      responses:
        '200':
          description: Alcances de la empresa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Alcance'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: guardarAlcance
      summary: Define o cambia el texto del alcance de una norma
      description: 'Cambiar el texto de un alcance aprobado lo devuelve a «sin aprobar». Orden de evaluación: 401, 403, 400, 404 (norma no adoptada).'
      tags: [alcance]
      x-permiso: alcance.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlcanceEntrada'
      responses:
        '200':
          description: El alcance guardado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alcance'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /alcances/aprobacion:
    post:
      operationId: aprobarAlcance
      summary: Aprueba el texto vigente del alcance de una norma
      description: 'Queda quién y cuándo. Orden de evaluación: 401, 403, 400, 404 (norma no adoptada o sin alcance definido), 409 (ya aprobado).'
      tags: [alcance]
      x-permiso: alcance.aprobar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlcanceNorma'
      responses:
        '200':
          description: El alcance aprobado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alcance'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /diagnostico:
    get:
      operationId: obtenerDiagnostico
      summary: Entradas de las librerías adoptadas con su evaluación y la madurez
      description: |
        La madurez se calcula sobre todas las entradas de la norma elegida (o de todas), sin importar los demás filtros.
        Es la madurez de la autoevaluación, no una probabilidad de certificarse. Orden: 401, 403, 400.
      tags: [diagnostico]
      x-permiso: diagnostico.ver
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ .:-]+$
        - name: norma
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [clausula, control]
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [cumple, parcial, no_cumple, no_aplica, sin_evaluar]
      responses:
        '200':
          description: El diagnóstico.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostico'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /diagnostico/evaluaciones:
    put:
      operationId: evaluarEntrada
      summary: Evalúa (o vuelve a evaluar) una cláusula o un control
      description: |
        Concurrencia optimista: `versionEsperada` es la versión que la persona vio (0 o ausente la primera vez). Si otra persona
        la cambió antes, responde 409 y no pisa su trabajo. Orden: 401, 403, 400, 404 (la entrada no existe para esta empresa), 409.
      tags: [diagnostico]
      x-permiso: diagnostico.evaluar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionEntrada'
      responses:
        '200':
          description: La evaluación guardada (o la vigente si no hubo cambios).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
