          type: string
          maxLength: 8
          pattern: ^A-[0-9]{3,6}$
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type:
          - string
          - 'null'
          maxLength: 500
        tipo:
          $ref: '#/components/schemas/TipoActivo'
        clasificacion:
          $ref: '#/components/schemas/ClasificacionActivo'
        responsableId:
          type: string
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoActivo'
        version:
          type: integer
          minimum: 1
    ActivoListado:
      type: object
