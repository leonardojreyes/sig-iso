      type: object
      required:
      - versionEsperada
      additionalProperties: false
      properties:
        versionEsperada:
          type: integer
          minimum: 1
    CierreAuditoria:
      type: object
      required:
      - id
      - codigo
      - estado
      - cerradaEn
      - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          maxLength: 12
        estado:
          $ref: '#/components/schemas/EstadoAuditoria'
        cerradaEn:
          type: string
          format: date-time
          maxLength: 40
        version:
          type: integer
          minimum: 1
    PanelAuditoria:
      type: object
      required:
      - programaAnio
      - prerrequisito
      - cobertura12Meses
      - auditorias
      additionalProperties: false
      properties:
        programaAnio:
          type:
          - integer
          - 'null'
        prerrequisito:
          type: object
          required:
          - cumple
          - auditoriasCerradas
          - brechas
          additionalProperties: false
          properties:
            cumple:
              type: boolean
              description: 'Solo informa: este módulo no decide la etapa.'
            auditoriasCerradas:
              type: integer
              minimum: 0
            brechas:
              type: object
              required:
              - clausulas
              - procesos
              - controles
              - sinDeclaracion
              additionalProperties: false
              properties:
                clausulas:
                  type: array
                  maxItems: 2000
                  items:
                    type: string
                    maxLength: 170
                procesos:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    format: uuid
                    maxLength: 36
                controles:
                  type: array
                  maxItems: 2000
                  items:
                    type: string
                    maxLength: 170
                sinDeclaracion:
                  type: boolean
                  description: Todavía no hay una Declaración de Aplicabilidad aprobada.
        cobertura12Meses:
          type: object
          required:
          - clausulas
          - controles
          - procesos
          additionalProperties: false
          properties:
            clausulas:
              type: object
              required:
              - total
              - cubiertas
              additionalProperties: false
              properties:
                total:
                  type: integer
                  minimum: 0
                cubiertas:
                  type: integer
                  minimum: 0
            controles:
              type: object
              required:
              - total
              - cubiertos
              - sinDeclaracion
              additionalProperties: false
              properties:
                total:
                  type: integer
                  minimum: 0
                cubiertos:
                  type: integer
                  minimum: 0
                sinDeclaracion:
                  type: boolean
            procesos:
              type: object
              required:
              - total
              - cubiertos
              additionalProperties: false
              properties:
                total:
                  type: integer
                  minimum: 0
                cubiertos:
                  type: integer
                  minimum: 0
        auditorias:
          type: object
          required:
          - total
          - cerradas
          - porEstado
          additionalProperties: false
          properties:
            total:
              type: integer
              minimum: 0
            cerradas:
              type: integer
              minimum: 0
            porEstado:
              type: object
              required:
              - planificada
              - en_preparacion
              - en_ejecucion
              - informe_emitido
              - cerrada
              - cancelada
              additionalProperties: false
              properties:
                planificada:
                  type: integer
                  minimum: 0
                en_preparacion:
                  type: integer
                  minimum: 0
                en_ejecucion:
                  type: integer
                  minimum: 0
                informe_emitido:
                  type: integer
                  minimum: 0
                cerrada:
                  type: integer
                  minimum: 0
                cancelada:
                  type: integer
                  minimum: 0
    TipoActivo:
      type: string
