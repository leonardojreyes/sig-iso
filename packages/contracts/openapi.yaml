          $ref: '#/components/schemas/MotivoDevolucion'
        nota:
          type: string
          maxLength: 300
    AprobacionVersion:
      type: object
      description: '`motivoExcepcion` solo aplica al único administrador que aprueba su propia versión y es obligatorio entonces.'
      required: []
      additionalProperties: false
      properties:
        proximaRevision:
          type: string
          format: date
          maxLength: 10
        requiereLectura:
          type: boolean
        motivoExcepcion:
          type: string
          maxLength: 300
    LecturaPendiente:
      type: object
      required:
      - versionId
      - documentoId
      - codigo
      - titulo
      - numeroVersion
