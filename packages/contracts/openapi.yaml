openapi: 3.1.0
info:
  title: sig-iso API
  version: 0.1.0
  description: |
    Contrato del corte vertical del paso 0.6: identidad de la persona que consulta, marca de su empresa, librerías de normas
    (catálogo global y adopción por empresa) y requisitos.

    **La empresa nunca la envía el cliente.** Sale únicamente del token verificado; ninguna operación recibe un identificador
    de empresa. Si el token no trae empresa, la solicitud se rechaza.

    **Un solo 404.** Para un recurso que no se puede ver, «no existe», «es de otra empresa» y «la librería no está adoptada»
    producen exactamente la misma respuesta.

    **Orden de evaluación.** Primero la autenticación (401), luego el permiso por rol (403, sin mirar el identificador), luego el
    formato de los parámetros (400) y por último la existencia (404). Así el código de error nunca revela si un identificador existe.

    **Datos personales.** `nombre` solo viaja en `/me` y nunca se escribe en registros técnicos ni en la bitácora (solo el
    identificador opaco).

    Los errores usan `application/problem+json` con un código de una lista cerrada y **sin texto libre** ni datos de la
    solicitud. Las respuestas autenticadas llevan `Cache-Control: no-store`.
servers:
  - url: http://localhost:3001
    description: Desarrollo local
tags:
  - name: salud
    description: Comprobación de disponibilidad
  - name: sesion
    description: Identidad y ciclo de la sesión
  - name: empresa
    description: Datos de la empresa de la persona que consulta
  - name: librerias
    description: Catálogo de librerías de normas y su adopción por la empresa
  - name: requisitos
    description: Entradas de las librerías adoptadas
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: comprobarSalud
      summary: Comprueba que la API responde
      tags: [salud]
      security: []
      responses:
        '200':
          description: La API responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /me:
    get:
      operationId: obtenerIdentidad
      summary: Identidad de quien consulta
      description: Devuelve la persona, sus roles y su empresa (nombre y slug), tomados del token verificado.
      tags: [sesion]
      responses:
        '200':
          description: Identidad de la persona.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identidad'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresa/marca:
    get:
      operationId: obtenerMarcaEmpresa
      summary: Marca de la empresa de quien consulta
      description: |
        Solo devuelve la marca de la empresa del token; la de otra empresa no viaja nunca. Si el color de la empresa no cumple el
        contraste mínimo se devuelve el color ajustado y `ajustadoPorContraste` en verdadero. El servidor nunca resuelve `logoUrl`:
        el navegador la carga con `referrerpolicy="no-referrer"` y una política de contenido restrictiva.
      tags: [empresa]
      responses:
        '200':
          description: Marca de la empresa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marca'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/inicio:
    post:
      operationId: registrarInicioSesion
      summary: Registra el inicio de sesión
      description: |
        El hecho se deriva del token verificado, nunca de datos enviados por el cliente, y es idempotente por sesión: repetirlo con
        la misma sesión responde 204 sin escribir otro registro. La sesión del navegador solo se emite cuando este registro se ha
        escrito.
      tags: [sesion]
      responses:
        '204':
          description: Inicio de sesión registrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/cierre:
    post:
      operationId: registrarCierreSesion
      summary: Registra el cierre de sesión
      description: Idempotente por sesión, como el inicio. Un token ya revocado responde 401.
      tags: [sesion]
      responses:
        '204':
          description: Cierre de sesión registrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias:
    get:
      operationId: listarLibrerias
      summary: Librerías del catálogo
      description: |
        Todas las librerías del catálogo GLOBAL con sus metadatos, e indica cuáles adoptó la empresa. Las entradas solo se ven si
        se adoptó. El catálogo es acotado por diseño y de solo lectura; una librería privada de una empresa exigiría su propia
        tabla con `empresa_id` y RLS, y no aparecería aquí.
      tags: [librerias]
      responses:
        '200':
          description: Librerías del catálogo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/LibreriaResumen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias/{id}/adopcion:
    post:
      operationId: adoptarLibreria
      summary: Adopta una librería para la empresa
      description: |
        Solo la persona con rol de administrador SIG. No hay cuerpo: la empresa y la persona salen del token. La autorización se
        decide en OpenFGA (relación `administrador_sig` sobre la empresa del token) y se evalúa ANTES de cualquier efecto; los
        rechazos por permiso también se registran en la bitácora.

        Orden de evaluación: 401, 403 (solo por rol, sin mirar el identificador: un colaborador recibe siempre el mismo 403, exista
        o no la librería), 404 (la función está apagada para la empresa por el flag `adopcion-habilitada`: se presenta como una
        operación inexistente, sin importar el identificador), 400 (UUID mal formado) y 404 (no existe). Adoptar una librería ya
        adoptada no es un error: responde 200 sin cambios.
      tags: [librerias]
      x-permiso: administrador_sig
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '201':
          description: Librería adoptada ahora.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adopcion'
        '200':
          description: La librería ya estaba adoptada; no hubo cambios.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adopcion'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /requisitos:
    get:
      operationId: listarRequisitos
      summary: Entradas de las librerías adoptadas
      description: |
        Solo incluye entradas de librerías que la empresa adoptó. Sin adopciones devuelve una lista vacía. Orden: por librería y,
        dentro de cada una, el orden de la librería (el cliente no puede reordenar). El catálogo es acotado por diseño: si
        algún día superara el tope de `maxItems`, se revisará este contrato (paginación) en lugar de truncar sin avisar.
        El servidor usa consultas parametrizadas; los filtros no admiten comodines.
      tags: [requisitos]
      parameters:
        - name: q
          in: query
          required: false
          description: Texto a buscar en el identificador o el título.
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ .:-]+$
        - name: capitulo
          in: query
          required: false
          description: Capítulo de la Estructura Armonizada (4 a 10).
          schema:
            type: integer
            minimum: 4
            maximum: 10
        - name: norma
          in: query
          required: false
          description: Norma a la que aplica la entrada, por ejemplo «ISO 9001».
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: tipo
          in: query
          required: false
          description: Cláusulas (capítulos 4 a 10) o controles del Anexo A.
          schema:
            type: string
            enum: [clausula, control]
      responses:
        '200':
          description: Entradas que cumplen el filtro.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: '#/components/schemas/EntradaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /requisitos/{id}:
    get:
      operationId: obtenerRequisito
      summary: Una entrada de una librería adoptada
      description: 'Orden de evaluación: 401, 400 (UUID mal formado) y 404 (única respuesta para «no existe», «es de otra empresa» y «su librería no está adoptada»).'
      tags: [requisitos]
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '200':
          description: La entrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /alcances:
    get:
      operationId: listarAlcances
      summary: Alcance de cada norma adoptada
      description: Una fila por norma de las librerías adoptadas; el alcance no definido llega con `texto` nulo.
      tags: [alcance]
      x-permiso: alcance.ver
      responses:
        '200':
          description: Alcances de la empresa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Alcance'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: guardarAlcance
      summary: Define o cambia el texto del alcance de una norma
      description: 'Cambiar el texto de un alcance aprobado lo devuelve a «sin aprobar». Orden de evaluación: 401, 403, 400, 404 (norma no adoptada).'
      tags: [alcance]
      x-permiso: alcance.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlcanceEntrada'
      responses:
        '200':
          description: El alcance guardado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alcance'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /alcances/aprobacion:
    post:
      operationId: aprobarAlcance
      summary: Aprueba el texto vigente del alcance de una norma
      description: 'Queda quién y cuándo. Orden de evaluación: 401, 403, 400, 404 (norma no adoptada o sin alcance definido), 409 (ya aprobado).'
      tags: [alcance]
      x-permiso: alcance.aprobar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlcanceNorma'
      responses:
        '200':
          description: El alcance aprobado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alcance'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /diagnostico:
    get:
      operationId: obtenerDiagnostico
      summary: Entradas de las librerías adoptadas con su evaluación y la madurez
      description: |
        La madurez se calcula sobre todas las entradas de la norma elegida (o de todas), sin importar los demás filtros.
        Es la madurez de la autoevaluación, no una probabilidad de certificarse. Orden: 401, 403, 400.
      tags: [diagnostico]
      x-permiso: diagnostico.ver
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ .:-]+$
        - name: norma
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [clausula, control]
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [cumple, parcial, no_cumple, no_aplica, sin_evaluar]
      responses:
        '200':
          description: El diagnóstico.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostico'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /diagnostico/evaluaciones:
    put:
      operationId: evaluarEntrada
      summary: Evalúa (o vuelve a evaluar) una cláusula o un control
      description: |
        Concurrencia optimista: `versionEsperada` es la versión que la persona vio (0 o ausente la primera vez). Si otra persona
        la cambió antes, responde 409 y no pisa su trabajo. Orden: 401, 403, 400, 404 (la entrada no existe para esta empresa), 409.
      tags: [diagnostico]
      x-permiso: diagnostico.evaluar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionEntrada'
      responses:
        '200':
          description: La evaluación guardada (o la vigente si no hubo cambios).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluacion'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por el sistema de identidad. La empresa sale de su contenido.
  headers:
    CacheControlNoStore:
      description: Las respuestas autenticadas no se guardan en caché (al volver con «atrás» no se muestran datos de una sesión cerrada).
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: Segundos que hay que esperar antes de volver a intentarlo.
      schema:
        type: integer
        minimum: 1
  parameters:
    IdRuta:
      name: id
      in: path
      required: true
      description: Identificador del recurso (UUID en forma canónica; sin llaves ni guiones omitidos).
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
  responses:
    NoAutenticado:
      description: Falta el token, está vencido, alterado o no trae empresa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            codigo: no_autenticado
    SinPermiso:
      description: La persona no tiene permiso para esta acción.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Sin permiso
            status: 403
            codigo: sin_permiso
    NoEncontrado:
      description: |
        El recurso no se puede ver. En el detalle de una entrada: no existe, es de otra empresa o pertenece a una librería que la
        empresa no adoptó; en la adopción: la librería no existe. Los casos son indistinguibles: misma respuesta, mismo cuerpo,
        mismas cabeceras.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No encontrado
            status: 404
            codigo: no_encontrado
    ParametrosInvalidos:
      description: Un parámetro no cumple el formato o los límites indicados. No se repite el valor recibido.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Parámetros no válidos
            status: 400
            codigo: parametro_invalido
    LimiteExcedido:
      description: Demasiadas solicitudes en poco tiempo. Se puede reintentar después de `Retry-After` segundos.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Límite de solicitudes excedido
            status: 429
            codigo: limite_excedido
    Conflicto:
      description: El estado actual no permite la acción (alcance ya aprobado) o otra persona cambió la evaluación mientras se editaba.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Conflicto
            status: 409
            codigo: conflicto
    ErrorInterno:
      description: Error interno. Si falla el registro en la bitácora de una acción, la acción no se completa y se responde con este error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Error interno
            status: 500
            codigo: error_interno
  schemas:
    Problema:
      type: object
      description: Error según RFC 9457, deliberadamente cerrado. No lleva `detail` ni campos libres para no filtrar datos de la solicitud.
      required: [type, title, status, codigo]
      additionalProperties: false
      properties:
        type:
          type: string
          const: about:blank
          maxLength: 20
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        codigo:
          type: string
          enum: [no_autenticado, sin_permiso, no_encontrado, parametro_invalido, conflicto, limite_excedido, error_interno]
    Salud:
      type: object
      required: [status, time]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        time:
          type: string
          format: date-time
          maxLength: 40
    Identidad:
      type: object
      description: La persona que consulta, tomada del token verificado.
      required: [usuarioId, nombre, roles, empresa]
      additionalProperties: false
      properties:
        usuarioId:
          type: string
          format: uuid
          maxLength: 36
          description: Identificador opaco de la cuenta.
        nombre:
          type: string
          maxLength: 120
        roles:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [administrador_sig, dueno_proceso, auditor_interno, auditor_externo, colaborador, alta_direccion]
        empresa:
          type: object
          description: La empresa del token. Solo el nombre y el slug (el de la URL `/e/<slug>`); no se expone su identificador interno.
          required: [slug, nombre]
          additionalProperties: false
          properties:
            slug:
              type: string
              pattern: ^[a-z0-9-]+$
              maxLength: 32
            nombre:
              type: string
              maxLength: 120
    Marca:
      type: object
      required: [nombre, colorPrimario, colorOriginal, ajustadoPorContraste, logoUrl]
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 120
        colorPrimario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
          description: Color que se aplica (ya ajustado si no cumplía el contraste mínimo).
        colorOriginal:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
          description: Color configurado por la empresa (es la marca de la propia empresa, no un dato de otra).
        ajustadoPorContraste:
          type: boolean
          description: Verdadero si el color original se ajustó para cumplir el contraste mínimo; el administrador SIG ve un aviso.
        logoUrl:
          type: [string, 'null']
          pattern: ^(https://[A-Za-z0-9.-]+(:[0-9]+)?/[^\s@]*|/[^/\\\s][^\s@]*)$
          maxLength: 2048
          description: Solo `https` sin credenciales en la URL, o una ruta propia (nunca `//host`). Si no es válido se devuelve nulo y se muestra el monograma.
    LibreriaResumen:
      type: object
      required: [id, codigo, nombre, version, esEjemplo, fuente, adoptada]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          maxLength: 20
        esEjemplo:
          type: boolean
          description: Una librería de ejemplo se muestra rotulada como tal.
        fuente:
          type: string
          maxLength: 200
        adoptada:
          type: boolean
          description: Si la empresa de quien consulta ya la adoptó.
    Adopcion:
      type: object
      required: [libreriaId, entradas, yaAdoptada, adoptadaEn]
      additionalProperties: false
      properties:
        libreriaId:
          type: string
          format: uuid
          maxLength: 36
        entradas:
          type: integer
          minimum: 0
          description: Cantidad de entradas que quedaron disponibles para la empresa.
        yaAdoptada:
          type: boolean
          description: Verdadero si la librería ya estaba adoptada (respuesta 200, sin cambios).
        adoptadaEn:
          type: string
          format: date-time
          maxLength: 40
    EntradaLibreria:
      type: object
      description: Una entrada (apartado) de una librería adoptada. Una cláusula real puede descomponerse en varios requisitos evaluables.
      required: [id, idEstable, libreriaId, capitulo, nivel, tipo, grupo, titulo, guia, alcanceComun, aplicaA, esEjemplo]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
          description: Identificador estable propio de la librería (no depende de la numeración de una norma).
        libreriaId:
          type: string
          format: uuid
          maxLength: 36
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
          description: Capítulo de la Estructura Armonizada; nulo en un control del Anexo A.
        nivel:
          type: integer
          enum: [1, 2]
        tipo:
          type: string
          enum: [clausula, control]
        grupo:
          type: [string, 'null']
          maxLength: 60
          description: Tema del control del Anexo A; nulo en una cláusula.
        titulo:
          type: string
          maxLength: 80
        guia:
          type: string
          maxLength: 280
        alcanceComun:
          type: string
          enum: [comun, parcial, especifico]
        aplicaA:
          type: array
          minItems: 1
          maxItems: 20
          description: Cláusula que corresponde a la entrada en cada norma y edición (el identificador puede diferir entre normas).
          items:
            type: object
            required: [norma, edicion, clausula]
            additionalProperties: false
            properties:
              norma:
                type: string
                maxLength: 60
              edicion:
                type: string
                pattern: ^[0-9]{4}$
                maxLength: 4
              clausula:
                type: string
                pattern: ^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*$
                maxLength: 20
        esEjemplo:
          type: boolean
          description: Si la librería es de ejemplo, la interfaz lo rotula y remite al ejemplar oficial de la empresa.
    AlcanceNorma:
      type: object
      required: [norma]
      additionalProperties: false
      properties:
        norma:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9 :./-]+$
    AlcanceEntrada:
      type: object
      required: [norma, texto]
      additionalProperties: false
      properties:
        norma:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9 :./-]+$
        texto:
          type: string
          minLength: 1
          maxLength: 4000
    Alcance:
      type: object
      required: [norma, texto, aprobado, aprobadoEn, actualizadoEn]
      additionalProperties: false
      properties:
        norma:
          type: string
          maxLength: 60
        texto:
          type: [string, 'null']
          maxLength: 4000
          description: Nulo mientras el alcance no se haya definido.
        aprobado:
          type: boolean
        aprobadoEn:
          type: [string, 'null']
          format: date-time
          maxLength: 40
        actualizadoEn:
          type: [string, 'null']
          format: date-time
          maxLength: 40
    EstadoEvaluacion:
      type: string
      enum: [cumple, parcial, no_cumple, no_aplica]
    EvaluacionEntrada:
      type: object
      required: [libreriaCodigo, idEstable, estado]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
          description: Obligatorio (mínimo 5 caracteres) para «no aplica».
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        versionEsperada:
          type: integer
          minimum: 0
    Evaluacion:
      type: object
      required: [libreriaCodigo, idEstable, estado, comentario, responsableId, fechaObjetivo, version]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        version:
          type: integer
          minimum: 1
    EvaluacionVigente:
      type: object
      required: [estado, comentario, fechaObjetivo, version]
      additionalProperties: false
      properties:
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        version:
          type: integer
          minimum: 1
    FilaDiagnostico:
      type: object
      required: [libreriaCodigo, idEstable, tipo, capitulo, grupo, titulo, guia, aplicaA, evaluacion]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        tipo:
          type: string
          enum: [clausula, control]
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
        grupo:
          type: [string, 'null']
          maxLength: 60
        titulo:
          type: string
          maxLength: 80
        guia:
          type: string
          maxLength: 280
        aplicaA:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [norma, edicion, clausula]
            additionalProperties: false
            properties:
              norma: {type: string, maxLength: 60}
              edicion: {type: string, pattern: '^[0-9]{4}$', maxLength: 4}
              clausula: {type: string, pattern: '^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*$', maxLength: 20}
        evaluacion:
          oneOf:
            - $ref: '#/components/schemas/EvaluacionVigente'
            - type: 'null'
          description: Nulo = sin evaluar.
    Desglose:
      type: object
      required: [cumple, parcial, noCumple, noAplica, sinEvaluar, total, porcentaje]
      additionalProperties: false
      properties:
        cumple: {type: integer, minimum: 0}
        parcial: {type: integer, minimum: 0}
        noCumple: {type: integer, minimum: 0}
        noAplica: {type: integer, minimum: 0}
        sinEvaluar: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        porcentaje:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Nulo si no hay nada evaluado que cuente (no es 0).
    MadurezNorma:
      type: object
      required: [norma, desglose]
      additionalProperties: false
      properties:
        norma:
          type: string
          maxLength: 60
        desglose:
          $ref: '#/components/schemas/Desglose'
    MadurezAgrupador:
      type: object
      required: [tipo, nombre, desglose]
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum: [capitulo, tema]
        nombre:
          type: string
          maxLength: 60
          description: Capítulo (por ejemplo «4») o tema del Anexo A.
        desglose:
          $ref: '#/components/schemas/Desglose'
    Madurez:
      type: object
      required: [porNorma, porAgrupador, clausulas]
      additionalProperties: false
      properties:
        porNorma:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MadurezNorma'
        porAgrupador:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MadurezAgrupador'
        clausulas:
          $ref: '#/components/schemas/Desglose'
    Diagnostico:
      type: object
      required: [filas, madurez, normas]
      additionalProperties: false
      properties:
        filas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FilaDiagnostico'
        madurez:
          $ref: '#/components/schemas/Madurez'
        normas:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 60
