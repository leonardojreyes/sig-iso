        '500':
          $ref: '#/components/responses/ErrorInterno'
  /personas/{id}/baja:
    post:
      operationId: darDeBajaPersona
      summary: Da de baja a una persona
      description: |
        Deja el rol en nulo y anota la baja; la persona no se borra (la autoría la referencia). Desde la siguiente petición no puede
        nada. No se da de baja al último administrador SIG (409). Orden de evaluación: 401, 403, 400, 404, 409.
      tags: [personas]
      x-permiso: personas.gestionar
      parameters:
