          format: uuid
          maxLength: 36
        emisor:
          type:
          - string
          - 'null'
          maxLength: 120
        edicionFuente:
          type:
          - string
          - 'null'
          maxLength: 60
        estado:
          type: string
          enum:
          - activo
          - retirado
        proximaRevision:
          type:
          - string
          - 'null'
          format: date
          maxLength: 10
        revision:
          oneOf:
