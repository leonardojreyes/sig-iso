      - sinRiesgos
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          maxLength: 8
          pattern: ^A-[0-9]{3,6}$
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type:
          - string
