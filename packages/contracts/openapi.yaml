  /controles/{id}/retiro:
    post:
      operationId: retirarControl
      summary: Retira un control
      description: |
        Un control no se borra: se retira y queda su rastro. Deja de cambiarse y de recibir mapeos, y su código no se reutiliza.
        Orden de evaluación: 401, 403, 400, 404, 409 (versión distinta o ya retirado).
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlVersion'
      responses:
        '200':
          description: El control retirado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}/mapeos:
    post:
      operationId: agregarMapeo
      summary: Relaciona un control con una entrada de una norma adoptada
      description: |
        201 la primera vez y 200 si el mapeo ya existía (no es un error). Un control retirado o con el tope de 50 mapeos responde 409.
        La entrada que la empresa no adoptó responde 404, igual que un control inexistente o de otra empresa. Orden de evaluación:
        401, 403, 400, 404, 409.
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapeoEntrada'
      responses:
        '200':
          description: El mapeo ya existía; no hubo cambios.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapeoResultado'
        '201':
          description: El mapeo creado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapeoResultado'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}/mapeos/eliminacion:
    post:
      operationId: quitarMapeo
      summary: Quita la relación entre un control y una entrada
      description: |
        No exige que la entrada siga adoptada. Un mapeo que no existe responde 404 y un control retirado, 409. Orden de evaluación:
        401, 403, 400, 404, 409.
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapeoEntrada'
      responses:
        '204':
          description: El mapeo se quitó.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}/evidencias:
    get:
      operationId: listarEvidencias
      summary: Evidencias de un control
      description: |
        De la más nueva a la más antigua. Por omisión solo las activas; con `incluirHistoricas` también las reemplazadas y eliminadas.
        Cada una indica si está vigente o vencida según la fecha de hoy en Ecuador. Orden de evaluación: 401, 403, 400, 404.
      tags: [evidencias]
      x-permiso: evidencias.ver
      parameters:
        - $ref: '#/components/parameters/IdRuta'
        - name: incluirHistoricas
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Las evidencias del control.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: subirEvidencia
      summary: Sube una evidencia con su archivo a un control vigente
      description: |
        `multipart/form-data` con **un solo archivo** (campo `archivo`) de hasta 25 MB. **Los campos de texto van ANTES del archivo**: la API
        decide el permiso, los datos y el control antes de leer un solo byte del archivo. El tipo se decide por el **contenido** (PDF, PNG,
        JPEG, TXT, DOCX, XLSX o PPTX; sin macros ni SVG ni HTML), nunca por la extensión ni por el tipo que declare el cliente: un archivo
        de otro tipo responde 415 y uno de más de 25 MB, 413. Una petición sin archivo responde 400. Un control retirado o con 100
        evidencias activas responde 409. Orden de evaluación: 401, 403, 400, 404, 409, 413 o 415.
      tags: [evidencias]
      x-permiso: evidencias.registrar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenciaSubida'
      responses:
        '201':
          description: La evidencia creada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoNoPermitido'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /evidencias/{id}/reemplazo:
    post:
      operationId: reemplazarEvidencia
      summary: Reemplaza una evidencia activa por otra con un archivo nuevo
      description: |
        Misma subida que `subirEvidencia` (campos antes del archivo, un archivo de hasta 25 MB, tipo por contenido). La anterior queda
        «reemplazada», con su archivo intacto, y la nueva apunta a ella. El título y el tipo se heredan si no se envían; la fecha del
        hecho es obligatoria. Reemplazar una evidencia que ya no está activa, o de un control retirado, responde 409. Si el archivo
        nuevo se rechaza, la original sigue activa.
      tags: [evidencias]
      x-permiso: evidencias.registrar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenciaReemplazo'
      responses:
        '201':
          description: La evidencia nueva.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoNoPermitido'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /evidencias/{id}/eliminacion:
    post:
      operationId: eliminarEvidencia
      summary: Elimina una evidencia activa
      description: |
        Cambia su estado a «eliminada» y queda el rastro; el archivo **no se borra**. Solo se elimina una evidencia activa (409 si ya no
        lo está). Orden de evaluación: 401, 403, 400, 404, 409.
      tags: [evidencias]
      x-permiso: evidencias.eliminar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '204':
          description: La evidencia se eliminó.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /evidencias/{id}/archivo:
    get:
      operationId: descargarEvidencia
      summary: Descarga el archivo de una evidencia
      description: |
        Siempre como **adjunto** (`Content-Disposition: attachment`), con el tipo que se detectó al subir, `X-Content-Type-Options: nosniff`
        y sin caché. La extensión del nombre es la que corresponde a ese tipo. La descarga **queda en la bitácora antes** de entregar el
        archivo y, si no se puede registrar, no se entrega. Una evidencia reemplazada se descarga (es el historial); una eliminada no
        (404). Orden de evaluación: 401, 403, 400, 404.
      tags: [evidencias]
      x-permiso: evidencias.ver
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '200':
          description: El archivo, como adjunto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Content-Disposition:
              description: Siempre `attachment`, con el nombre normalizado y la extensión del tipo detectado.
              schema:
