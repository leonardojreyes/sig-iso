          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion:
    get:
      operationId: obtenerDeclaracion
      summary: Borrador de la Declaración de Aplicabilidad de ISO/IEC 27001
      description: |
        Una fila por control del Anexo A de las librerías adoptadas, DERIVADA del diagnóstico, de los controles de la empresa y de la
        cobertura de las evidencias; no se guarda nada. Trae también la última versión aprobada, si hay, y la justificación: por fila, los
        motivos registrados y los riesgos que la tratan (derivado), y qué impide aprobar. Orden: 401, 403.
      tags: [declaracion]
      x-permiso: declaracion.ver
      responses:
        '200':
          description: El borrador derivado con lo que hay hoy.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion/aprobacion:
    post:
      operationId: aprobarDeclaracion
      summary: Aprueba la declaración y congela una versión nueva
      description: |
        Congela, en una sola transacción, lo que la API lee en ese momento: las filas, el alcance de 27001 y los conteos. La versión es
        inmutable y su número es correlativo por empresa. Responde 409 si queda algún control por decidir (o no hay controles de la norma
        adoptados) y 409 si otra persona aprobó al mismo tiempo. Un control que aplica sin control de la empresa asignado SÍ se puede
        aprobar: queda señalado en el documento. También responde 409 si un control que aplica no tiene motivo de inclusión (ni riesgo
        que lo trate ni motivo registrado). Congela además los motivos, los riesgos tal como estaban, las referencias al tratamiento y la
        escala del nivel de riesgo. Orden: 401, 403, 409.
      tags: [declaracion]
      x-permiso: declaracion.aprobar
      responses:
        '201':
          description: La versión aprobada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDeclaracion'
        '401':
