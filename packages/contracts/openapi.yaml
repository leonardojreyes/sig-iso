        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles:
    get:
      operationId: listarControles
      summary: Marco de controles unificado de la empresa
      description: |
        Cada control con las entradas de las normas que cubre y las normas que alcanza. Por omisión solo los vigentes. Un mapeo a una
        entrada que la empresa ya no tiene adoptada llega con `entrada` nula y no suma normas. Orden de evaluación: 401, 403, 400.
      tags: [controles]
      x-permiso: controles.ver
      parameters:
        - name: norma
          in: query
          required: false
          description: Solo los controles que alcanzan esta norma.
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: incluirRetirados
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: El marco de controles.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcoControles'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearControl
      summary: Crea un control de la empresa
      description: |
        El código es propio de la empresa y no se repite, ni siquiera con el de un control retirado (409). Orden de evaluación: 401, 403, 400, 409.
      tags: [controles]
      x-permiso: controles.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlEntrada'
      responses:
        '201':
          description: El control creado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}:
    put:
      operationId: cambiarControl
      summary: Cambia el nombre, la descripción o el responsable de un control vigente
      description: |
        Concurrencia optimista: `versionEsperada` es la versión que la persona vio. Si otra persona lo cambió antes, o el control
        está retirado, responde 409. Lo que no se envía se conserva; `null` quita la descripción o el responsable. Orden de evaluación:
        401, 403, 400, 404 (no existe o es de otra empresa), 409.
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCambios'
      responses:
        '200':
          description: El control con los cambios, o tal como estaba si no hubo cambios.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
