          maxLength: 10
          pattern: ^[A-Z]{3}-[0-9]{3,6}$
        tipo:
          $ref: '#/components/schemas/TipoDocumento'
        titulo:
          type: string
          maxLength: 120
        area:
          type:
          - string
          - 'null'
          maxLength: 60
        clasificacion:
          $ref: '#/components/schemas/ClasificacionDocumento'
        responsableId:
