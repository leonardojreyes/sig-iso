components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por el sistema de identidad. La empresa sale de su contenido.
  headers:
    CacheControlNoStore:
      description: Las respuestas autenticadas no se guardan en caché (al volver con «atrás» no se muestran datos de una sesión cerrada).
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: Segundos que hay que esperar antes de volver a intentarlo.
      schema:
        type: integer
        minimum: 1
  parameters:
    IdRuta:
      name: id
      in: path
      required: true
      description: Identificador del recurso (UUID en forma canónica; sin llaves ni guiones omitidos).
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
  responses:
    NoAutenticado:
      description: Falta el token, está vencido, alterado o no trae empresa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            codigo: no_autenticado
    SinPermiso:
      description: La persona no tiene permiso para esta acción.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Sin permiso
            status: 403
            codigo: sin_permiso
    NoEncontrado:
      description: |
        El recurso no se puede ver. En el detalle de una entrada: no existe, es de otra empresa o pertenece a una librería que la
        empresa no adoptó; en la adopción: la librería no existe. Los casos son indistinguibles: misma respuesta, mismo cuerpo,
        mismas cabeceras.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No encontrado
            status: 404
            codigo: no_encontrado
    ParametrosInvalidos:
      description: Un parámetro no cumple el formato o los límites indicados. No se repite el valor recibido.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Parámetros no válidos
            status: 400
            codigo: parametro_invalido
    LimiteExcedido:
      description: Demasiadas solicitudes en poco tiempo. Se puede reintentar después de `Retry-After` segundos.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Límite de solicitudes excedido
            status: 429
            codigo: limite_excedido
    Conflicto:
      description: El estado actual no permite la acción (alcance ya aprobado) o otra persona cambió la evaluación mientras se editaba.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Conflicto
            status: 409
            codigo: conflicto
    ArchivoDemasiadoGrande:
      description: El archivo pasa de 25 MB. No se guarda nada y el rechazo queda en la bitácora.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Archivo demasiado grande
            status: 413
            codigo: archivo_demasiado_grande
    LibreriaDemasiadoGrande:
      description: El archivo de la librería pasa de 1 MB. No se lee ni se guarda nada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Archivo demasiado grande
            status: 413
            codigo: archivo_demasiado_grande
    TipoNoPermitido:
      description: |
        El contenido del archivo no es de un tipo permitido o está dañado (PDF, PNG, JPEG, TXT, DOCX, XLSX o PPTX; sin macros, SVG ni HTML).
        El tipo se decide por el contenido, no por la extensión. No se guarda nada y el rechazo queda en la bitácora.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Tipo de archivo no permitido
            status: 415
            codigo: tipo_no_permitido
    ErrorInterno:
      description: Error interno. Si falla el registro en la bitácora de una acción, la acción no se completa y se responde con este error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Error interno
            status: 500
            codigo: error_interno
  schemas:
    Problema:
      type: object
      description: Error según RFC 9457, deliberadamente cerrado. No lleva `detail` ni campos libres para no filtrar datos de la solicitud.
      required: [type, title, status, codigo]
      additionalProperties: false
      properties:
        type:
          type: string
          const: about:blank
          maxLength: 20
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        codigo:
          type: string
          enum: [no_autenticado, sin_permiso, no_encontrado, parametro_invalido, conflicto, archivo_demasiado_grande, tipo_no_permitido, limite_excedido, error_interno]
    Salud:
      type: object
      required: [status, time]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        time:
          type: string
          format: date-time
          maxLength: 40
    EmpresaDePersona:
      type: object
      required: [slug, nombre, activa]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 32
        nombre:
          type: string
          maxLength: 120
        activa:
          type: boolean
          description: Es la empresa de esta sesión ahora.
    EmpresaElegida:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          minLength: 1
          maxLength: 32
    EmpresaActual:
      type: object
      required: [slug, nombre]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 32
        nombre:
          type: string
          maxLength: 120
    Identidad:
      type: object
      description: La persona que consulta, tomada del token verificado.
      required: [usuarioId, nombre, roles, empresa]
      additionalProperties: false
      properties:
        usuarioId:
          type: string
          format: uuid
          maxLength: 36
          description: Identificador opaco de la cuenta.
        nombre:
          type: string
          maxLength: 120
        roles:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [administrador_sig, dueno_proceso, auditor_interno, auditor_externo, colaborador, alta_direccion]
        empresa:
          type: object
          description: La empresa del token. Solo el nombre y el slug (el de la URL `/e/<slug>`); no se expone su identificador interno.
          required: [slug, nombre]
          additionalProperties: false
          properties:
            slug:
              type: string
              pattern: ^[a-z0-9-]+$
              maxLength: 32
            nombre:
              type: string
              maxLength: 120
    Marca:
      type: object
      required: [nombre, colorPrimario, colorOriginal, ajustadoPorContraste, logoUrl]
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 120
        colorPrimario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
          description: Color que se aplica (ya ajustado si no cumplía el contraste mínimo).
        colorOriginal:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
          description: Color configurado por la empresa (es la marca de la propia empresa, no un dato de otra).
        ajustadoPorContraste:
          type: boolean
          description: Verdadero si el color original se ajustó para cumplir el contraste mínimo; el administrador SIG ve un aviso.
        logoUrl:
          type: [string, 'null']
          pattern: ^(https://[A-Za-z0-9.-]+(:[0-9]+)?/[^\s@]*|/logos/[A-Za-z0-9._-]{1,100}\.(png|svg|jpe?g|webp))$
          maxLength: 2048
          description: Solo `https` sin credenciales en la URL, o un archivo de imagen bajo `/logos/` (nunca otra ruta del sitio). Si no es válido se devuelve nulo y se muestra el monograma.
    MarcaEdicion:
      type: object
      description: Lo que la empresa elige. La empresa nunca viaja aquí, sale del token.
      required: [colorPrimario, logoUrl]
      additionalProperties: false
      properties:
        colorPrimario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
        logoUrl:
          type: [string, 'null']
          pattern: ^(https://[A-Za-z0-9.-]+(:[0-9]+)?/[^\s@]*|/logos/[A-Za-z0-9._-]{1,100}\.(png|svg|jpe?g|webp))$
          maxLength: 2048
          description: Solo `https` sin credenciales, un archivo de imagen bajo `/logos/` o nulo para quitarlo.
    RolPersona:
      type: string
      enum: [administrador_sig, dueno_proceso, auditor_interno, auditor_externo, colaborador, alta_direccion]
    SolicitudAcceso:
      type: object
      description: Lo que la persona le entrega al administrador. No lleva nombre ni correo.
      required: [codigo, venceEn]
      additionalProperties: false
      properties:
        codigo:
          type: string
          pattern: ^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$
          maxLength: 9
        venceEn:
          type: string
          format: date-time
          maxLength: 40
    SolicitudPendiente:
      type: object
      required: [id, usuarioId, codigo, creadaEn, venceEn]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        usuarioId:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          pattern: ^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$
          maxLength: 9
        creadaEn:
          type: string
          format: date-time
          maxLength: 40
        venceEn:
          type: string
          format: date-time
          maxLength: 40
    Persona:
      type: object
      description: Una persona de la empresa. El rol nulo es una persona sin acceso (dada de baja). Nombre y correo son datos personales.
      required: [id, nombre, correo, rol, bajaEn, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          minLength: 3
          maxLength: 254
        rol:
          type: [string, 'null']
          enum: [administrador_sig, dueno_proceso, auditor_interno, auditor_externo, colaborador, alta_direccion, null]
          description: Nulo si la persona está dada de baja (sin acceso).
        bajaEn:
          type: [string, 'null']
          format: date-time
          maxLength: 40
        version:
          type: integer
          minimum: 1
    Personas:
      type: object
      required: [personas, solicitudes]
      additionalProperties: false
      properties:
        personas:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Persona'
        solicitudes:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SolicitudPendiente'
    AprobacionSolicitud:
      type: object
      description: Lo que escribe el administrador. La empresa y la persona de la solicitud no viajan aquí.
      required: [nombre, correo, rol]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        correo:
          type: string
          minLength: 3
          maxLength: 254
        rol:
          $ref: '#/components/schemas/RolPersona'
    CambioDeRol:
      type: object
      required: [rol, versionEsperada]
      additionalProperties: false
      properties:
        rol:
          $ref: '#/components/schemas/RolPersona'
        versionEsperada:
          type: integer
          minimum: 1
    PersonaVersion:
      type: object
      required: [versionEsperada]
      additionalProperties: false
      properties:
        versionEsperada:
          type: integer
          minimum: 1
    LibreriaResumen:
      type: object
      required: [id, codigo, nombre, version, esEjemplo, fuente, propia, adoptada]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          maxLength: 20
        esEjemplo:
          type: boolean
          description: Una librería de ejemplo se muestra rotulada como tal.
        fuente:
          type: string
          maxLength: 200
        propia:
          type: boolean
          description: Verdadero si la subió la empresa de quien consulta (ADR 034); falso si es del catálogo global.
        adoptada:
          type: boolean
          description: Si la empresa de quien consulta ya la adoptó.
    LibreriaSubida:
      type: object
      required: [archivo]
      additionalProperties: false
      properties:
        archivo:
          type: string
          format: binary
          description: El YAML de la librería (hasta 1 MB).
    ErrorCargaLibreria:
      type: object
      description: Qué falló y dónde. Nunca repite el contenido del archivo.
      required: [entrada, indice, ruta, codigo]
      additionalProperties: false
      properties:
        entrada:
          type: [string, 'null']
          maxLength: 41
          description: Identificador de la entrada afectada, si aplica.
        indice:
          type: [integer, 'null']
          minimum: 0
          maximum: 999
        ruta:
          type: string
          maxLength: 200
        codigo:
          type: string
          maxLength: 60
    CargaLibreria:
      type: object
      required: [estado, motivo, codigo, version, entradas, huella, errores]
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [cargada, ya_cargada, rechazada]
        motivo:
          type: [string, 'null']
          enum: [tipo_no_permitido, tamano_excedido, formato_invalido, contenido_no_permitido, codigo_no_permitido, hash_distinto, null]
          description: Solo si el estado es `rechazada`.
        codigo:
          type: [string, 'null']
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        version:
          type: [string, 'null']
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          maxLength: 20
        entradas:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
        huella:
          type: string
          pattern: ^[0-9a-f]{64}$
          maxLength: 64
          description: SHA-256 del contenido canónico (si es válida) o de los bytes del archivo (si no).
        errores:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ErrorCargaLibreria'
    Adopcion:
      type: object
      required: [libreriaId, entradas, yaAdoptada, adoptadaEn]
      additionalProperties: false
      properties:
        libreriaId:
          type: string
          format: uuid
          maxLength: 36
        entradas:
          type: integer
          minimum: 0
          description: Cantidad de entradas que quedaron disponibles para la empresa.
        yaAdoptada:
          type: boolean
          description: Verdadero si la librería ya estaba adoptada (respuesta 200, sin cambios).
        adoptadaEn:
          type: string
          format: date-time
          maxLength: 40
    EntradaLibreria:
      type: object
      description: Una entrada (apartado) de una librería adoptada. Una cláusula real puede descomponerse en varios requisitos evaluables.
      required: [id, idEstable, libreriaId, capitulo, nivel, tipo, grupo, titulo, guia, alcanceComun, aplicaA, esEjemplo]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
          description: Identificador estable propio de la librería (no depende de la numeración de una norma).
        libreriaId:
          type: string
          format: uuid
          maxLength: 36
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
          description: Capítulo de la Estructura Armonizada; nulo en un control del Anexo A.
        nivel:
          type: integer
          enum: [1, 2]
        tipo:
          type: string
          enum: [clausula, control]
        grupo:
          type: [string, 'null']
          maxLength: 60
          description: Tema del control del Anexo A; nulo en una cláusula.
        titulo:
          type: string
          maxLength: 80
        guia:
          type: string
          maxLength: 280
        alcanceComun:
          type: string
          enum: [comun, parcial, especifico]
        aplicaA:
          type: array
          minItems: 1
          maxItems: 20
          description: Cláusula que corresponde a la entrada en cada norma y edición (el identificador puede diferir entre normas).
          items:
            type: object
            required: [norma, edicion, clausula]
            additionalProperties: false
            properties:
              norma:
                type: string
                maxLength: 60
              edicion:
                type: string
                pattern: ^[0-9]{4}$
                maxLength: 4
              clausula:
                type: string
                pattern: ^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*$
                maxLength: 20
        esEjemplo:
          type: boolean
          description: Si la librería es de ejemplo, la interfaz lo rotula y remite al ejemplar oficial de la empresa.
    AlcanceNorma:
      type: object
      required: [norma]
      additionalProperties: false
      properties:
        norma:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9 :./-]+$
    AlcanceEntrada:
      type: object
      required: [norma, texto]
      additionalProperties: false
      properties:
        norma:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9 :./-]+$
        texto:
          type: string
          minLength: 1
          maxLength: 4000
    Alcance:
      type: object
      required: [norma, texto, aprobado, aprobadoEn, actualizadoEn]
      additionalProperties: false
      properties:
        norma:
          type: string
          maxLength: 60
        texto:
          type: [string, 'null']
          maxLength: 4000
          description: Nulo mientras el alcance no se haya definido.
        aprobado:
          type: boolean
        aprobadoEn:
          type: [string, 'null']
          format: date-time
          maxLength: 40
        actualizadoEn:
          type: [string, 'null']
          format: date-time
          maxLength: 40
    EstadoEvaluacion:
      type: string
      enum: [cumple, parcial, no_cumple, no_aplica]
    EvaluacionEntrada:
      type: object
      required: [libreriaCodigo, idEstable, estado]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
          description: Obligatorio (mínimo 5 caracteres) para «no aplica».
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        versionEsperada:
          type: integer
          minimum: 0
    Evaluacion:
      type: object
      required: [libreriaCodigo, idEstable, estado, comentario, responsableId, fechaObjetivo, version]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        version:
          type: integer
          minimum: 1
    EvaluacionVigente:
      type: object
      required: [estado, comentario, fechaObjetivo, version]
      additionalProperties: false
      properties:
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        version:
          type: integer
          minimum: 1
    FilaDiagnostico:
      type: object
      required: [libreriaCodigo, idEstable, tipo, capitulo, grupo, titulo, guia, aplicaA, evaluacion]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        tipo:
          type: string
          enum: [clausula, control]
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
        grupo:
          type: [string, 'null']
          maxLength: 60
        titulo:
          type: string
          maxLength: 80
        guia:
          type: string
          maxLength: 280
        aplicaA:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [norma, edicion, clausula]
            additionalProperties: false
            properties:
              norma: {type: string, maxLength: 60}
              edicion: {type: string, pattern: '^[0-9]{4}$', maxLength: 4}
              clausula: {type: string, pattern: '^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*$', maxLength: 20}
        evaluacion:
          oneOf:
            - $ref: '#/components/schemas/EvaluacionVigente'
            - type: 'null'
          description: Nulo = sin evaluar.
    Desglose:
      type: object
      required: [cumple, parcial, noCumple, noAplica, sinEvaluar, total, porcentaje]
      additionalProperties: false
      properties:
        cumple: {type: integer, minimum: 0}
        parcial: {type: integer, minimum: 0}
        noCumple: {type: integer, minimum: 0}
        noAplica: {type: integer, minimum: 0}
        sinEvaluar: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        porcentaje:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Nulo si no hay nada evaluado que cuente (no es 0).
    MadurezNorma:
      type: object
      required: [norma, desglose]
      additionalProperties: false
      properties:
        norma:
          type: string
          maxLength: 60
        desglose:
          $ref: '#/components/schemas/Desglose'
    MadurezAgrupador:
      type: object
      required: [tipo, nombre, desglose]
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum: [capitulo, tema]
        nombre:
          type: string
