          type: string
          maxLength: 41
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
    VinculoDocumentoResultado:
      type: object
      required:
      - creado
      additionalProperties: false
      properties:
        creado:
          type: boolean
