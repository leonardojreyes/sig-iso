      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        entrada:
          oneOf:
            - $ref: '#/components/schemas/EntradaDeMapeo'
            - type: 'null'
          description: Nula si la entrada ya no está entre las librerías que la empresa adoptó.
    ControlMarco:
      type: object
      required: [id, codigo, nombre, descripcion, responsableId, estado, version, mapeos, normas]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoControl'
        version:
          type: integer
          minimum: 1
        mapeos:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MapeoDeControl'
        normas:
          type: array
          maxItems: 20
          description: Normas que alcanza por los mapeos cuyas entradas siguen adoptadas.
          items:
            type: string
            maxLength: 60
    MarcoControles:
      type: object
      required: [controles, normas]
      additionalProperties: false
      properties:
        controles:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ControlMarco'
        normas:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 60
    TipoEvidencia:
      type: string
      enum: [documento, registro]
    EstadoEvidencia:
      type: string
      enum: [activa, reemplazada, eliminada]
    TipoArchivo:
      type: string
      enum:
        - application/pdf
        - image/png
        - image/jpeg
        - text/plain
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
    ArchivoEvidencia:
      type: object
      required: [nombre, tipo, bytes, sha256]
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 120
          description: Etiqueta normalizada (sin carpetas ni símbolos); en el almacén el archivo es un UUID del servidor.
        tipo:
          $ref: '#/components/schemas/TipoArchivo'
        bytes:
          type: integer
          minimum: 1
          maximum: 26214400
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          maxLength: 64
    Evidencia:
      type: object
      required: [id, controlId, tipo, titulo, fechaHecho, vigenteHasta, estado, reemplazaId, vigente, vencida, creadaEn, archivo]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        controlId:
          type: string
          format: uuid
          maxLength: 36
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        titulo:
          type: string
          maxLength: 120
        fechaHecho:
          type: string
          format: date
          maxLength: 10
        vigenteHasta:
          type: [string, 'null']
          format: date
          maxLength: 10
        estado:
          $ref: '#/components/schemas/EstadoEvidencia'
        reemplazaId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        vigente:
          type: boolean
          description: Activa y con la vigencia al día (fecha de hoy en Ecuador).
        vencida:
          type: boolean
          description: Activa pero con la vigencia ya pasada.
        creadaEn:
          type: string
          format: date-time
          maxLength: 40
        archivo:
          $ref: '#/components/schemas/ArchivoEvidencia'
    EvidenciaSubida:
      type: object
      description: Los campos de texto van antes del archivo.
      required: [tipo, titulo, fechaHecho, archivo]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        fechaHecho:
          type: string
          format: date
          maxLength: 10
          description: El día en que ocurrió lo que la evidencia demuestra; no puede ser futuro.
        vigenteHasta:
          type: string
          format: date
          maxLength: 10
          description: Opcional; no anterior a la fecha del hecho.
        archivo:
          type: string
          format: binary
    EvidenciaReemplazo:
      type: object
      description: Los campos de texto van antes del archivo.
      required: [fechaHecho, archivo]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        fechaHecho:
          type: string
          format: date
          maxLength: 10
        vigenteHasta:
          type: string
          format: date
          maxLength: 10
        archivo:
          type: string
          format: binary
    AplicabilidadDeclaracion:
      type: string
      enum: [aplica, no_aplica, por_decidir]
    FilaDeclaracion:
      type: object
      required: [libreriaCodigo, idEstable, orden, titulo, grupo, aplicabilidad, implementacion, justificacion, controles, cobertura]
      additionalProperties: false
      properties:
        libreriaCodigo: {type: string, maxLength: 64}
        idEstable: {type: string, maxLength: 41}
        orden: {type: integer, minimum: 0}
        titulo: {type: string, maxLength: 200}
        grupo: {type: [string, 'null'], maxLength: 80}
        aplicabilidad:
          $ref: '#/components/schemas/AplicabilidadDeclaracion'
        implementacion:
          type: [string, 'null']
          maxLength: 20
          description: 'implementado, parcial o no_implementado; nula si no aplica o está por decidir.'
        justificacion:
          type: [string, 'null']
          maxLength: 1000
          description: Solo si no aplica; es la que la empresa escribió al evaluar.
        controles:
          type: array
          maxItems: 50
          items: {type: string, maxLength: 20}
          description: Códigos de los controles vigentes de la empresa que la cubren.
        cobertura:
          $ref: '#/components/schemas/EstadoCobertura'
    ResumenDeclaracion:
      type: object
      required: [total, aplican, noAplican, porDecidir, sinControl, aprobable]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        aplican: {type: integer, minimum: 0}
        noAplican: {type: integer, minimum: 0}
        porDecidir: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0, description: Aplican y ningún control de la empresa los cubre; no impide aprobar.}
        aprobable: {type: boolean, description: Hay filas, ninguna está por decidir y ningún control que aplica está sin motivo.}
    VersionDeclaracion:
      type: object
      required: [id, numero, total, aplican, noAplican, sinControl, aprobadaPor, aprobadaEn]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        numero: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        aplican: {type: integer, minimum: 0}
        noAplican: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        aprobadaPor: {type: string, format: uuid, maxLength: 36}
        aprobadaEn: {type: string, format: date-time, maxLength: 40}
    VersionDeclaracionConFilas:
      type: object
      required: [id, numero, total, aplican, noAplican, sinControl, aprobadaPor, aprobadaEn, alcance, filas, justificacion]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        numero: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        aplican: {type: integer, minimum: 0}
        noAplican: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        aprobadaPor: {type: string, format: uuid, maxLength: 36}
        aprobadaEn: {type: string, format: date-time, maxLength: 40}
        alcance:
          type: [string, 'null']
          maxLength: 4000
          description: El alcance de la norma tal como estaba al aprobar.
        filas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FilaDeclaracion'
        justificacion:
          $ref: '#/components/schemas/JustificacionVersion'
    Declaracion:
      type: object
      required: [norma, hoy, resumen, filas, alcance, ultimaVersion, justificacion]
      additionalProperties: false
      properties:
        norma: {type: string, maxLength: 60}
        hoy:
          type: string
          format: date
          maxLength: 10
          description: La fecha de hoy en Ecuador con la que se calculó la cobertura.
        resumen:
          $ref: '#/components/schemas/ResumenDeclaracion'
        filas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FilaDeclaracion'
        alcance:
          type: [object, 'null']
          required: [texto, aprobado]
          additionalProperties: false
          description: El alcance de la norma tal como está hoy (aprobado o no); nulo si no se definió.
          properties:
            texto: {type: string, maxLength: 4000}
            aprobado: {type: boolean}
        ultimaVersion:
          type: [object, 'null']
          required: [id, numero, total, aplican, noAplican, sinControl, aprobadaPor, aprobadaEn]
          additionalProperties: false
          description: La última versión aprobada; nula si todavía no hay ninguna.
          properties:
            id: {type: string, format: uuid, maxLength: 36}
            numero: {type: integer, minimum: 1}
            total: {type: integer, minimum: 0}
            aplican: {type: integer, minimum: 0}
            noAplican: {type: integer, minimum: 0}
            sinControl: {type: integer, minimum: 0}
            aprobadaPor: {type: string, format: uuid, maxLength: 36}
            aprobadaEn: {type: string, format: date-time, maxLength: 40}
        justificacion:
          $ref: '#/components/schemas/JustificacionBorrador'
    EstadoCobertura:
      type: string
      enum: [cubierta, evidencia_vencida, sin_evidencia, sin_control, no_aplica]
    ResumenCobertura:
      type: object
      required: [total, cubiertas, evidenciaVencida, sinEvidencia, sinControl, porcentaje]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        cubiertas: {type: integer, minimum: 0}
        evidenciaVencida: {type: integer, minimum: 0}
        sinEvidencia: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        porcentaje:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Nulo si no hay ninguna entrada a la que pedir cobertura (no es 0).
    CoberturaNorma:
      type: object
      required: [norma, total, cubiertas, evidenciaVencida, sinEvidencia, sinControl, porcentaje]
      additionalProperties: false
      properties:
        norma: {type: string, maxLength: 60}
        total: {type: integer, minimum: 0}
        cubiertas: {type: integer, minimum: 0}
        evidenciaVencida: {type: integer, minimum: 0}
        sinEvidencia: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        porcentaje:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
    CoberturaEntrada:
      type: object
      required: [libreriaCodigo, idEstable, tipo, capitulo, grupo, titulo, normas, estado, controles, evidencias]
      additionalProperties: false
      properties:
        libreriaCodigo: {type: string, maxLength: 64}
        idEstable: {type: string, maxLength: 41}
        tipo:
          type: string
          enum: [clausula, control]
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
        grupo:
          type: [string, 'null']
          maxLength: 60
        titulo: {type: string, maxLength: 80}
        normas:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 60}
        estado:
          $ref: '#/components/schemas/EstadoCobertura'
        controles:
          type: integer
          minimum: 0
          description: Controles vigentes que la cubren por un mapeo.
        evidencias:
          type: integer
          minimum: 0
          description: Evidencias activas de esos controles (vigentes o no).
    Cobertura:
      type: object
      required: [hoy, entradas, porNorma, total, normas]
      additionalProperties: false
      properties:
        hoy:
          type: string
          format: date
          maxLength: 10
          description: La fecha de hoy en Ecuador con la que se calculó el vencimiento.
        entradas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CoberturaEntrada'
        porNorma:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CoberturaNorma'
        total:
          $ref: '#/components/schemas/ResumenCobertura'
        normas:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 60}
    NivelRiesgo:
      type: string
      enum: [bajo, medio, alto, critico]
      description: Nivel inicial calculado de probabilidad por impacto con los cortes de `EscalaRiesgo`; la persona no lo escribe.
    DecisionTratamiento:
      type: string
      enum: [mitigar, aceptar, transferir, evitar]
      description: Equivale a modificar, retener, compartir o evitar el riesgo. «aceptar» exige responsable.
    EstadoRiesgo:
      type: string
      enum: [vigente, retirado]
    TipoMotivo:
      type: string
      enum: [legal, contractual, negocio, otro]
      description: Los motivos que se registran. El motivo «riesgo» no se escribe; se deriva de los riesgos vigentes.
    TipoReferencia:
      type: string
      enum: [analisis, plan]
      description: «analisis» es el documento de análisis de riesgos; «plan» es el plan de tratamiento.
    ViaRiesgo:
      type: string
      enum: [control, previsto]
      description: «control» si lo trata un control vigente de la empresa; «previsto» si solo es un tratamiento previsto sin control propio.
    Riesgo:
      type: object
      required: [id, codigo, titulo, descripcion, probabilidad, impacto, puntaje, nivel, decision, responsableId, estado, version]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        codigo:
          type: string
          pattern: ^R-[0-9]{3,6}$
          maxLength: 8
        titulo: {type: string, maxLength: 120}
        descripcion: {type: [string, 'null'], maxLength: 1000}
        probabilidad: {type: integer, minimum: 1, maximum: 5}
        impacto: {type: integer, minimum: 1, maximum: 5}
        puntaje: {type: integer, minimum: 1, maximum: 25, description: Probabilidad por impacto.}
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        decision:
          $ref: '#/components/schemas/DecisionTratamiento'
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoRiesgo'
        version: {type: integer, minimum: 1}
    RiesgoListado:
      type: object
      required: [id, codigo, titulo, descripcion, probabilidad, impacto, puntaje, nivel, decision, responsableId, estado, version, controles, tratamientosPrevistos, sinTratamiento]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        codigo:
          type: string
          pattern: ^R-[0-9]{3,6}$
          maxLength: 8
        titulo: {type: string, maxLength: 120}
        descripcion: {type: [string, 'null'], maxLength: 1000}
        probabilidad: {type: integer, minimum: 1, maximum: 5}
        impacto: {type: integer, minimum: 1, maximum: 5}
        puntaje: {type: integer, minimum: 1, maximum: 25}
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        decision:
          $ref: '#/components/schemas/DecisionTratamiento'
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoRiesgo'
        version: {type: integer, minimum: 1}
        controles: {type: integer, minimum: 0, maximum: 50, description: Controles VIGENTES de la empresa que lo tratan.}
        tratamientosPrevistos: {type: integer, minimum: 0, maximum: 50, description: Controles del Anexo A vinculados directo.}
        sinTratamiento: {type: boolean, description: Está vigente, su decisión es «mitigar» y no tiene ningún control vigente ni tratamiento previsto.}
    ControlDeRiesgo:
      type: object
      required: [id, codigo, nombre, estado]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        codigo:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,19}$
          maxLength: 20
        nombre: {type: string, maxLength: 120}
        estado:
          $ref: '#/components/schemas/EstadoControl'
    TratamientoPrevisto:
      type: object
      required: [libreriaCodigo, idEstable, titulo]
      additionalProperties: false
      properties:
        libreriaCodigo: {type: string, maxLength: 64}
        idEstable: {type: string, maxLength: 41}
        titulo:
          type: [string, 'null']
          maxLength: 200
          description: Nulo si la entrada ya no está entre las librerías adoptadas por la empresa.
    RiesgoDetalle:
      type: object
      required: [id, codigo, titulo, descripcion, probabilidad, impacto, puntaje, nivel, decision, responsableId, estado, version, controles, tratamientosPrevistos]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        codigo:
          type: string
          pattern: ^R-[0-9]{3,6}$
          maxLength: 8
        titulo: {type: string, maxLength: 120}
        descripcion: {type: [string, 'null'], maxLength: 1000}
        probabilidad: {type: integer, minimum: 1, maximum: 5}
        impacto: {type: integer, minimum: 1, maximum: 5}
        puntaje: {type: integer, minimum: 1, maximum: 25}
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        decision:
          $ref: '#/components/schemas/DecisionTratamiento'
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoRiesgo'
        version: {type: integer, minimum: 1}
        controles:
          type: array
          maxItems: 50
          description: Controles de la empresa que lo tratan; los retirados se marcan y el vínculo se conserva.
          items:
            $ref: '#/components/schemas/ControlDeRiesgo'
        tratamientosPrevistos:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/TratamientoPrevisto'
    RiesgoEntrada:
      type: object
      required: [titulo, probabilidad, impacto, decision]
      additionalProperties: false
      properties:
        titulo: {type: string, minLength: 1, maxLength: 120}
        descripcion: {type: [string, 'null'], maxLength: 1000}
        probabilidad: {type: integer, minimum: 1, maximum: 5}
        impacto: {type: integer, minimum: 1, maximum: 5}
        decision:
          $ref: '#/components/schemas/DecisionTratamiento'
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
    RiesgoCambios:
      type: object
      required: [versionEsperada]
      additionalProperties: false
      properties:
        versionEsperada: {type: integer, minimum: 1}
        titulo: {type: string, minLength: 1, maxLength: 120}
        descripcion: {type: [string, 'null'], maxLength: 1000}
        probabilidad: {type: integer, minimum: 1, maximum: 5}
        impacto: {type: integer, minimum: 1, maximum: 5}
        decision:
          $ref: '#/components/schemas/DecisionTratamiento'
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
    RiesgoVersion:
      type: object
      required: [versionEsperada]
      additionalProperties: false
      properties:
        versionEsperada: {type: integer, minimum: 1}
    VinculoControlEntrada:
      type: object
      required: [controlId]
      additionalProperties: false
      properties:
        controlId: {type: string, format: uuid, maxLength: 36}
    VinculoResultado:
      type: object
      required: [creado]
      additionalProperties: false
      properties:
        creado:
          type: boolean
          description: Verdadero si se creó (201); falso si ya existía (200).
    AvisoRetiroRiesgo:
      type: object
      required: [riesgoId, codigo, controlesSinMotivo]
      additionalProperties: false
      properties:
        riesgoId: {type: string, format: uuid, maxLength: 36}
        codigo:
          type: string
          pattern: ^R-[0-9]{3,6}$
          maxLength: 8
        controlesSinMotivo:
          type: array
          maxItems: 500
          description: Controles del Anexo A que aplican y quedarían sin motivo al retirar el riesgo. Vacío si el retiro no deja nada sin motivo.
          items:
            type: object
            required: [libreriaCodigo, idEstable, titulo]
            additionalProperties: false
            properties:
              libreriaCodigo: {type: string, maxLength: 64}
              idEstable: {type: string, maxLength: 41}
              titulo: {type: string, maxLength: 200}
    MotivoDeclaracion:
      type: object
      required: [libreriaCodigo, idEstable, tipo, nota, version]
      additionalProperties: false
      properties:
        libreriaCodigo: {type: string, maxLength: 64}
        idEstable: {type: string, maxLength: 41}
        tipo:
          $ref: '#/components/schemas/TipoMotivo'
        nota: {type: string, maxLength: 500, description: En palabras de la empresa; no debe llevar datos personales ni texto de las normas.}
        version: {type: integer, minimum: 1}
    MotivoEntrada:
      type: object
      required: [libreriaCodigo, idEstable, tipo, nota]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
          maxLength: 64
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
        tipo:
          $ref: '#/components/schemas/TipoMotivo'
        nota: {type: string, minLength: 1, maxLength: 500}
        versionEsperada: {type: integer, minimum: 1, description: Ausente = crear; presente = la versión que la persona vio.}
    MotivoQuitar:
      type: object
      required: [libreriaCodigo, idEstable, tipo, versionEsperada]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
          maxLength: 64
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
        tipo:
          $ref: '#/components/schemas/TipoMotivo'
        versionEsperada: {type: integer, minimum: 1}
    ReferenciaDeclaracion:
      type: object
      required: [tipo, titulo, versionDoc, fecha, ubicacion, version]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoReferencia'
        titulo: {type: string, maxLength: 120}
        versionDoc: {type: string, maxLength: 40}
        fecha: {type: string, format: date, maxLength: 10}
        ubicacion: {type: string, maxLength: 200, description: Dónde o con qué código conserva la empresa el documento.}
        version: {type: integer, minimum: 1}
    ReferenciaEntrada:
      type: object
      required: [tipo, titulo, versionDoc, fecha, ubicacion]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoReferencia'
        titulo: {type: string, minLength: 1, maxLength: 120}
        versionDoc: {type: string, minLength: 1, maxLength: 40}
        fecha: {type: string, format: date, maxLength: 10}
        ubicacion: {type: string, minLength: 1, maxLength: 200}
        versionEsperada: {type: integer, minimum: 1, description: Ausente = crear; presente = la versión que la persona vio.}
    ReferenciaQuitar:
      type: object
      required: [tipo, versionEsperada]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoReferencia'
        versionEsperada: {type: integer, minimum: 1}
    EscalaRiesgo:
      type: object
      required: [escalaMax, corteMedio, corteAlto, corteCritico]
      additionalProperties: false
      description: La escala de probabilidad e impacto (1 a escalaMax) y el primer puntaje de cada nivel. Es el método por omisión de la herramienta, no el criterio de aceptación de la empresa.
      properties:
        escalaMax: {type: integer, minimum: 2, maximum: 10}
        corteMedio: {type: integer, minimum: 2, maximum: 100}
        corteAlto: {type: integer, minimum: 3, maximum: 100}
        corteCritico: {type: integer, minimum: 4, maximum: 100}
    MotivoDeFila:
      type: object
      required: [tipo, nota]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoMotivo'
        nota: {type: string, maxLength: 500}
    RiesgoDeFila:
      type: object
      required: [codigo, titulo, nivel, via]
      additionalProperties: false
      properties:
        codigo:
          type: string
          pattern: ^R-[0-9]{3,6}$
          maxLength: 8
        titulo: {type: string, maxLength: 120}
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        via:
          $ref: '#/components/schemas/ViaRiesgo'
    FilaJustificacion:
      type: object
      required: [libreriaCodigo, idEstable, sinMotivo, motivos, riesgos]
      additionalProperties: false
      properties:
        libreriaCodigo: {type: string, maxLength: 64}
        idEstable: {type: string, maxLength: 41}
        sinMotivo: {type: boolean, description: Aplica y no tiene ningún riesgo ni motivo registrado; impide aprobar.}
        motivos:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/MotivoDeFila'
        riesgos:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/RiesgoDeFila'
    BloqueoDeclaracion:
      type: string
      enum: [sin_filas, por_decidir, sin_motivo]
    JustificacionBorrador:
      type: object
      required: [conMotivo, sinMotivo, riesgosVigentes, riesgosSinTratamiento, bloqueos, filas, referencias, escala, faltaPlanTratamiento]
      additionalProperties: false
      description: Lo que justifica el borrador, derivado en vivo de los riesgos, los motivos y las referencias.
      properties:
        conMotivo: {type: integer, minimum: 0, description: Controles que aplican y tienen un riesgo derivado o un motivo registrado.}
        sinMotivo: {type: integer, minimum: 0, description: Controles que aplican y no tienen motivo; impiden aprobar.}
        riesgosVigentes: {type: integer, minimum: 0}
        riesgosSinTratamiento: {type: integer, minimum: 0, description: Advertencia, no bloqueo: riesgos «mitigar» sin control vigente ni tratamiento previsto.}
        bloqueos:
          type: array
          maxItems: 3
          description: Qué impide aprobar; vacío si se puede aprobar.
          items:
            $ref: '#/components/schemas/BloqueoDeclaracion'
        filas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FilaJustificacion'
        referencias:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/ReferenciaDeclaracion'
        escala:
          $ref: '#/components/schemas/EscalaRiesgo'
        faltaPlanTratamiento: {type: boolean, description: Hay riesgos «mitigar» y no hay referencia al plan de tratamiento (advierte, no bloquea).}
    RiesgoCongelado:
      type: object
      required: [codigo, titulo, probabilidad, impacto, nivel, decision, responsableId, controles]
      additionalProperties: false
      properties:
        codigo:
          type: string
          pattern: ^R-[0-9]{3,6}$
          maxLength: 8
        titulo: {type: string, maxLength: 120}
        probabilidad: {type: integer, minimum: 1, maximum: 10}
        impacto: {type: integer, minimum: 1, maximum: 10}
        nivel:
          $ref: '#/components/schemas/NivelRiesgo'
        decision:
          $ref: '#/components/schemas/DecisionTratamiento'
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        controles:
          type: array
          maxItems: 50
          description: Códigos de los controles vigentes de la empresa que lo trataban.
          items: {type: string, maxLength: 20}
    JustificacionVersion:
      type: [object, 'null']
      required: [escala, conMotivo, riesgosVigentes, motivos, riesgos, riesgosPorFila, referencias]
      additionalProperties: false
      description: Lo que justificaba la versión al aprobarla, tal como se congeló. Cambiar después un riesgo, un motivo o una referencia no la altera. Nula en las versiones aprobadas antes de la Declaración justificada (sin motivos ni riesgos).
      properties:
        escala:
          $ref: '#/components/schemas/EscalaRiesgo'
        conMotivo: {type: integer, minimum: 0}
        riesgosVigentes: {type: integer, minimum: 0}
        motivos:
          type: array
          maxItems: 500
          items:
            type: object
            required: [libreriaCodigo, idEstable, tipo, nota]
            additionalProperties: false
            properties:
              libreriaCodigo: {type: string, maxLength: 64}
              idEstable: {type: string, maxLength: 41}
              tipo:
                $ref: '#/components/schemas/TipoMotivo'
              nota: {type: string, maxLength: 500}
        riesgos:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/RiesgoCongelado'
        riesgosPorFila:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [libreriaCodigo, idEstable, riesgoCodigo, via]
            additionalProperties: false
            properties:
              libreriaCodigo: {type: string, maxLength: 64}
              idEstable: {type: string, maxLength: 41}
              riesgoCodigo:
                type: string
                pattern: ^R-[0-9]{3,6}$
                maxLength: 8
              via:
                $ref: '#/components/schemas/ViaRiesgo'
        referencias:
          type: array
          maxItems: 2
          items:
            type: object
            required: [tipo, titulo, versionDoc, fecha, ubicacion]
            additionalProperties: false
            properties:
              tipo:
                $ref: '#/components/schemas/TipoReferencia'
              titulo: {type: string, maxLength: 120}
              versionDoc: {type: string, maxLength: 40}
              fecha: {type: string, format: date, maxLength: 10}
              ubicacion: {type: string, maxLength: 200}
    TipoDocumento:
      type: string
