      - persona
      - servicio_terceros
      - instalacion
    ClasificacionActivo:
      type: string
      enum:
      - publica
      - interna
      - confidencial
      - restringida
    EstadoActivo:
      type: string
      enum:
      - vigente
      - retirado
    Activo:
      type: object
      description: 'La clasificación es informativa: no limita quién lee.'
      required:
      - id
      - codigo
      - nombre
      - descripcion
      - tipo
      - clasificacion
      - responsableId
      - estado
      - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
