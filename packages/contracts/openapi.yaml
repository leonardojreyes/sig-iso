openapi: 3.1.0
info:
  title: sig-iso API
  version: 0.1.0
  description: |
    Contrato del corte vertical del paso 0.6: identidad de la persona que consulta, marca de su empresa, librerías de normas
    (catálogo global y adopción por empresa) y requisitos.

    **La empresa nunca la envía el cliente.** Sale únicamente del token verificado; ninguna operación recibe un identificador
    de empresa. Si el token no trae empresa, la solicitud se rechaza.

    **Un solo 404.** Para un recurso que no se puede ver, «no existe», «es de otra empresa» y «la librería no está adoptada»
    producen exactamente la misma respuesta.

    **Orden de evaluación.** Primero la autenticación (401), luego el permiso por rol (403, sin mirar el identificador), luego el
    formato de los parámetros (400) y por último la existencia (404). Así el código de error nunca revela si un identificador existe.

    **Datos personales.** `nombre` solo viaja en `/me` y nunca se escribe en registros técnicos ni en la bitácora (solo el
    identificador opaco).

    Los errores usan `application/problem+json` con un código de una lista cerrada y **sin texto libre** ni datos de la
    solicitud. Las respuestas autenticadas llevan `Cache-Control: no-store`.
servers:
  - url: http://localhost:3001
    description: Desarrollo local
tags:
  - name: salud
    description: Comprobación de disponibilidad
  - name: sesion
    description: Identidad y ciclo de la sesión
  - name: empresa
    description: Datos de la empresa de la persona que consulta
  - name: librerias
    description: Catálogo de librerías de normas y su adopción por la empresa
  - name: requisitos
    description: Entradas de las librerías adoptadas
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: comprobarSalud
      summary: Comprueba que la API responde
      tags: [salud]
      security: []
      responses:
        '200':
          description: La API responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /me:
    get:
      operationId: obtenerIdentidad
      summary: Identidad de quien consulta
      description: Devuelve la persona, sus roles y su empresa (nombre y slug), tomados del token verificado.
      tags: [sesion]
      responses:
        '200':
          description: Identidad de la persona.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identidad'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/empresas:
    get:
      operationId: listarMisEmpresas
      summary: Las empresas a las que pertenece quien consulta
      description: |
        Una persona puede pertenecer a varias empresas (un consultor), cada una con su propio rol (ADR 035). Solo se listan las suyas,
        con el nombre y el slug (el de la URL `/e/<slug>`), por nombre; `activa` marca la de esta sesión. Quien pertenece a una sola
        empresa recibe una lista de un elemento.
      tags: [sesion]
      responses:
        '200':
          description: Las empresas de la persona.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/EmpresaDePersona'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/empresa:
    post:
      operationId: cambiarEmpresa
      summary: Cambia la empresa activa de la sesión
      description: |
        ÚNICA operación que nombra una empresa (ADR 035). La API toma la persona y la sesión del token verificado y comprueba en la base
        que la persona **pertenece** a la empresa pedida con un rol; si no, responde 404 (igual que una empresa que no existe) y deja un
        `acceso.cruzado`. Si pertenece, registra `empresa.cambiada` en la empresa destino y recién entonces guarda la empresa activa de
        ESA sesión (vence con la sesión máxima, 8 h). Desde la siguiente petición, todo se evalúa con esa empresa y con el rol que la
        persona tiene allí. Ninguna otra operación acepta una empresa del cliente.

        Orden de evaluación: 401, 400 (slug mal formado) y 404 (no pertenece).
      tags: [sesion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaElegida'
      responses:
        '200':
          description: La empresa activa de la sesión es ahora la pedida.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaActual'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /empresa/marca:
    get:
      operationId: obtenerMarcaEmpresa
      summary: Marca de la empresa de quien consulta
      description: |
        Solo devuelve la marca de la empresa del token; la de otra empresa no viaja nunca. Si el color de la empresa no cumple el
        contraste mínimo se devuelve el color ajustado y `ajustadoPorContraste` en verdadero. El servidor nunca resuelve `logoUrl`:
        el navegador la carga con `referrerpolicy="no-referrer"` y una política de contenido restrictiva.
      tags: [empresa]
      responses:
        '200':
          description: Marca de la empresa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marca'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/inicio:
    post:
      operationId: registrarInicioSesion
      summary: Registra el inicio de sesión
      description: |
        El hecho se deriva del token verificado, nunca de datos enviados por el cliente, y es idempotente por sesión: repetirlo con
        la misma sesión responde 204 sin escribir otro registro. La sesión del navegador solo se emite cuando este registro se ha
        escrito.
      tags: [sesion]
      responses:
        '204':
          description: Inicio de sesión registrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /sesion/cierre:
    post:
      operationId: registrarCierreSesion
      summary: Registra el cierre de sesión
      description: Idempotente por sesión, como el inicio. Un token ya revocado responde 401.
      tags: [sesion]
      responses:
        '204':
          description: Cierre de sesión registrado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias:
    get:
      operationId: listarLibrerias
      summary: Librerías del catálogo
      description: |
        Las librerías del catálogo GLOBAL (de solo lectura) y las PROPIAS de la empresa de quien consulta (ADR 034), con sus
        metadatos, e indica cuáles adoptó la empresa. Las entradas solo se ven si se adoptó. Una librería propia de otra empresa
        nunca aparece. Cada versión es una fila.
      tags: [librerias]
      responses:
        '200':
          description: Librerías del catálogo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/LibreriaResumen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias/carga:
    post:
      operationId: cargarLibreria
      summary: Sube una librería de norma propia de la empresa (archivo YAML)
      description: |
        Solo la persona con rol de administrador SIG (`normas.cargar`). `multipart/form-data` con **un solo archivo** (campo `archivo`)
        YAML de hasta 1 MB, sin alias ni anclas, con el esquema v3 de las librerías (sin texto de la norma). El código debe empezar con
        `propia-` y la librería no puede ser de ejemplo. La librería queda **propia de la empresa del token** y nunca es visible para
        otra; cada versión es inmutable (la misma versión con otro contenido se rechaza).

        Un archivo que no pasa la validación **no es un error HTTP**: responde 200 con `estado: rechazada`, el motivo y la lista de
        errores por ruta (nunca el contenido), y el rechazo queda en la bitácora. 201 si se cargó ahora; 200 si ya estaba cargada
        (mismo contenido) o si se rechazó. 413 si declara más de 1 MB (sin leerlo) y 400 si no llega el archivo.
        Orden de evaluación: 401, 403, 400, 413, y después la validación del contenido.
      tags: [librerias]
      x-permiso: normas.cargar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LibreriaSubida'
      responses:
        '201':
          description: La librería se cargó ahora.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaLibreria'
        '200':
          description: Ya estaba cargada (mismo contenido) o el archivo se rechazó; ver `estado`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '413':
          $ref: '#/components/responses/LibreriaDemasiadoGrande'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /librerias/{id}/adopcion:
    post:
      operationId: adoptarLibreria
      summary: Adopta una librería para la empresa
      description: |
        Solo la persona con rol de administrador SIG. No hay cuerpo: la empresa y la persona salen del token. La autorización se
        decide en OpenFGA (relación `administrador_sig` sobre la empresa del token) y se evalúa ANTES de cualquier efecto; los
        rechazos por permiso también se registran en la bitácora.

        Orden de evaluación: 401, 403 (solo por rol, sin mirar el identificador: un colaborador recibe siempre el mismo 403, exista
        o no la librería), 404 (la función está apagada para la empresa por el flag `adopcion-habilitada`: se presenta como una
        operación inexistente, sin importar el identificador), 400 (UUID mal formado) y 404 (no existe). Adoptar una librería ya
        adoptada no es un error: responde 200 sin cambios.
      tags: [librerias]
      x-permiso: administrador_sig
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '201':
          description: Librería adoptada ahora.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adopcion'
        '200':
          description: La librería ya estaba adoptada; no hubo cambios.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adopcion'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /requisitos:
    get:
      operationId: listarRequisitos
      summary: Entradas de las librerías adoptadas
      description: |
        Solo incluye entradas de librerías que la empresa adoptó. Sin adopciones devuelve una lista vacía. Orden: por librería y,
        dentro de cada una, el orden de la librería (el cliente no puede reordenar). El catálogo es acotado por diseño: si
        algún día superara el tope de `maxItems`, se revisará este contrato (paginación) en lugar de truncar sin avisar.
        El servidor usa consultas parametrizadas; los filtros no admiten comodines.
      tags: [requisitos]
      parameters:
        - name: q
          in: query
          required: false
          description: Texto a buscar en el identificador o el título.
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ .:-]+$
        - name: capitulo
          in: query
          required: false
          description: Capítulo de la Estructura Armonizada (4 a 10).
          schema:
            type: integer
            minimum: 4
            maximum: 10
        - name: norma
          in: query
          required: false
          description: Norma a la que aplica la entrada, por ejemplo «ISO 9001».
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: tipo
          in: query
          required: false
          description: Cláusulas (capítulos 4 a 10) o controles del Anexo A.
          schema:
            type: string
            enum: [clausula, control]
      responses:
        '200':
          description: Entradas que cumplen el filtro.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: '#/components/schemas/EntradaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /requisitos/{id}:
    get:
      operationId: obtenerRequisito
      summary: Una entrada de una librería adoptada
      description: 'Orden de evaluación: 401, 400 (UUID mal formado) y 404 (única respuesta para «no existe», «es de otra empresa» y «su librería no está adoptada»).'
      tags: [requisitos]
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '200':
          description: La entrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaLibreria'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /alcances:
    get:
      operationId: listarAlcances
      summary: Alcance de cada norma adoptada
      description: Una fila por norma de las librerías adoptadas; el alcance no definido llega con `texto` nulo.
      tags: [alcance]
      x-permiso: alcance.ver
      responses:
        '200':
          description: Alcances de la empresa.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/Alcance'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    put:
      operationId: guardarAlcance
      summary: Define o cambia el texto del alcance de una norma
      description: 'Cambiar el texto de un alcance aprobado lo devuelve a «sin aprobar». Orden de evaluación: 401, 403, 400, 404 (norma no adoptada).'
      tags: [alcance]
      x-permiso: alcance.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlcanceEntrada'
      responses:
        '200':
          description: El alcance guardado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alcance'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /alcances/aprobacion:
    post:
      operationId: aprobarAlcance
      summary: Aprueba el texto vigente del alcance de una norma
      description: 'Queda quién y cuándo. Orden de evaluación: 401, 403, 400, 404 (norma no adoptada o sin alcance definido), 409 (ya aprobado).'
      tags: [alcance]
      x-permiso: alcance.aprobar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlcanceNorma'
      responses:
        '200':
          description: El alcance aprobado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alcance'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /diagnostico:
    get:
      operationId: obtenerDiagnostico
      summary: Entradas de las librerías adoptadas con su evaluación y la madurez
      description: |
        La madurez se calcula sobre todas las entradas de la norma elegida (o de todas), sin importar los demás filtros.
        Es la madurez de la autoevaluación, no una probabilidad de certificarse. Orden: 401, 403, 400.
      tags: [diagnostico]
      x-permiso: diagnostico.ver
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: ^[A-Za-z0-9ÁÉÍÓÚÜÑáéíóúüñ .:-]+$
        - name: norma
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [clausula, control]
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [cumple, parcial, no_cumple, no_aplica, sin_evaluar]
      responses:
        '200':
          description: El diagnóstico.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostico'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /diagnostico/evaluaciones:
    put:
      operationId: evaluarEntrada
      summary: Evalúa (o vuelve a evaluar) una cláusula o un control
      description: |
        Concurrencia optimista: `versionEsperada` es la versión que la persona vio (0 o ausente la primera vez). Si otra persona
        la cambió antes, responde 409 y no pisa su trabajo. Orden: 401, 403, 400, 404 (la entrada no existe para esta empresa), 409.
      tags: [diagnostico]
      x-permiso: diagnostico.evaluar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluacionEntrada'
      responses:
        '200':
          description: La evaluación guardada (o la vigente si no hubo cambios).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluacion'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles:
    get:
      operationId: listarControles
      summary: Marco de controles unificado de la empresa
      description: |
        Cada control con las entradas de las normas que cubre y las normas que alcanza. Por omisión solo los vigentes. Un mapeo a una
        entrada que la empresa ya no tiene adoptada llega con `entrada` nula y no suma normas. Orden de evaluación: 401, 403, 400.
      tags: [controles]
      x-permiso: controles.ver
      parameters:
        - name: norma
          in: query
          required: false
          description: Solo los controles que alcanzan esta norma.
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
        - name: incluirRetirados
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: El marco de controles.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarcoControles'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: crearControl
      summary: Crea un control de la empresa
      description: |
        El código es propio de la empresa y no se repite, ni siquiera con el de un control retirado (409). Orden de evaluación: 401, 403, 400, 409.
      tags: [controles]
      x-permiso: controles.gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlEntrada'
      responses:
        '201':
          description: El control creado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}:
    put:
      operationId: cambiarControl
      summary: Cambia el nombre, la descripción o el responsable de un control vigente
      description: |
        Concurrencia optimista: `versionEsperada` es la versión que la persona vio. Si otra persona lo cambió antes, o el control
        está retirado, responde 409. Lo que no se envía se conserva; `null` quita la descripción o el responsable. Orden de evaluación:
        401, 403, 400, 404 (no existe o es de otra empresa), 409.
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCambios'
      responses:
        '200':
          description: El control con los cambios, o tal como estaba si no hubo cambios.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}/retiro:
    post:
      operationId: retirarControl
      summary: Retira un control
      description: |
        Un control no se borra: se retira y queda su rastro. Deja de cambiarse y de recibir mapeos, y su código no se reutiliza.
        Orden de evaluación: 401, 403, 400, 404, 409 (versión distinta o ya retirado).
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlVersion'
      responses:
        '200':
          description: El control retirado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}/mapeos:
    post:
      operationId: agregarMapeo
      summary: Relaciona un control con una entrada de una norma adoptada
      description: |
        201 la primera vez y 200 si el mapeo ya existía (no es un error). Un control retirado o con el tope de 50 mapeos responde 409.
        La entrada que la empresa no adoptó responde 404, igual que un control inexistente o de otra empresa. Orden de evaluación:
        401, 403, 400, 404, 409.
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapeoEntrada'
      responses:
        '200':
          description: El mapeo ya existía; no hubo cambios.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapeoResultado'
        '201':
          description: El mapeo creado.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapeoResultado'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}/mapeos/eliminacion:
    post:
      operationId: quitarMapeo
      summary: Quita la relación entre un control y una entrada
      description: |
        No exige que la entrada siga adoptada. Un mapeo que no existe responde 404 y un control retirado, 409. Orden de evaluación:
        401, 403, 400, 404, 409.
      tags: [controles]
      x-permiso: controles.gestionar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapeoEntrada'
      responses:
        '204':
          description: El mapeo se quitó.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /controles/{id}/evidencias:
    get:
      operationId: listarEvidencias
      summary: Evidencias de un control
      description: |
        De la más nueva a la más antigua. Por omisión solo las activas; con `incluirHistoricas` también las reemplazadas y eliminadas.
        Cada una indica si está vigente o vencida según la fecha de hoy en Ecuador. Orden de evaluación: 401, 403, 400, 404.
      tags: [evidencias]
      x-permiso: evidencias.ver
      parameters:
        - $ref: '#/components/parameters/IdRuta'
        - name: incluirHistoricas
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Las evidencias del control.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
    post:
      operationId: subirEvidencia
      summary: Sube una evidencia con su archivo a un control vigente
      description: |
        `multipart/form-data` con **un solo archivo** (campo `archivo`) de hasta 25 MB. **Los campos de texto van ANTES del archivo**: la API
        decide el permiso, los datos y el control antes de leer un solo byte del archivo. El tipo se decide por el **contenido** (PDF, PNG,
        JPEG, TXT, DOCX, XLSX o PPTX; sin macros ni SVG ni HTML), nunca por la extensión ni por el tipo que declare el cliente: un archivo
        de otro tipo responde 415 y uno de más de 25 MB, 413. Una petición sin archivo responde 400. Un control retirado o con 100
        evidencias activas responde 409. Orden de evaluación: 401, 403, 400, 404, 409, 413 o 415.
      tags: [evidencias]
      x-permiso: evidencias.registrar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenciaSubida'
      responses:
        '201':
          description: La evidencia creada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoNoPermitido'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /evidencias/{id}/reemplazo:
    post:
      operationId: reemplazarEvidencia
      summary: Reemplaza una evidencia activa por otra con un archivo nuevo
      description: |
        Misma subida que `subirEvidencia` (campos antes del archivo, un archivo de hasta 25 MB, tipo por contenido). La anterior queda
        «reemplazada», con su archivo intacto, y la nueva apunta a ella. El título y el tipo se heredan si no se envían; la fecha del
        hecho es obligatoria. Reemplazar una evidencia que ya no está activa, o de un control retirado, responde 409. Si el archivo
        nuevo se rechaza, la original sigue activa.
      tags: [evidencias]
      x-permiso: evidencias.registrar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EvidenciaReemplazo'
      responses:
        '201':
          description: La evidencia nueva.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidencia'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '415':
          $ref: '#/components/responses/TipoNoPermitido'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /evidencias/{id}/eliminacion:
    post:
      operationId: eliminarEvidencia
      summary: Elimina una evidencia activa
      description: |
        Cambia su estado a «eliminada» y queda el rastro; el archivo **no se borra**. Solo se elimina una evidencia activa (409 si ya no
        lo está). Orden de evaluación: 401, 403, 400, 404, 409.
      tags: [evidencias]
      x-permiso: evidencias.eliminar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '204':
          description: La evidencia se eliminó.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /evidencias/{id}/archivo:
    get:
      operationId: descargarEvidencia
      summary: Descarga el archivo de una evidencia
      description: |
        Siempre como **adjunto** (`Content-Disposition: attachment`), con el tipo que se detectó al subir, `X-Content-Type-Options: nosniff`
        y sin caché. La extensión del nombre es la que corresponde a ese tipo. La descarga **queda en la bitácora antes** de entregar el
        archivo y, si no se puede registrar, no se entrega. Una evidencia reemplazada se descarga (es el historial); una eliminada no
        (404). Orden de evaluación: 401, 403, 400, 404.
      tags: [evidencias]
      x-permiso: evidencias.ver
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '200':
          description: El archivo, como adjunto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Content-Disposition:
              description: Siempre `attachment`, con el nombre normalizado y la extensión del tipo detectado.
              schema:
                type: string
                maxLength: 300
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /cobertura:
    get:
      operationId: obtenerCobertura
      summary: Cobertura documental de las entradas de las normas adoptadas
      description: |
        Para cada entrada que no se evaluó como «no aplica»: cubierta (algún control vigente que la cubre tiene una evidencia activa y
        vigente), evidencia vencida, sin evidencia o sin control. Se resume por norma. Mide la cobertura documental, no la eficacia de
        los controles. Orden de evaluación: 401, 403, 400.
      tags: [evidencias]
      x-permiso: evidencias.ver
      parameters:
        - name: norma
          in: query
          required: false
          description: Solo las entradas que aplican a esta norma.
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
      responses:
        '200':
          description: La cobertura.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cobertura'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion:
    get:
      operationId: obtenerDeclaracion
      summary: Borrador de la Declaración de Aplicabilidad de ISO/IEC 27001
      description: |
        Una fila por control del Anexo A de las librerías adoptadas, DERIVADA del diagnóstico, de los controles de la empresa y de la
        cobertura de las evidencias; no se guarda nada. Trae también la última versión aprobada, si hay. Orden: 401, 403.
      tags: [declaracion]
      x-permiso: declaracion.ver
      responses:
        '200':
          description: El borrador derivado con lo que hay hoy.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Declaracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion/aprobacion:
    post:
      operationId: aprobarDeclaracion
      summary: Aprueba la declaración y congela una versión nueva
      description: |
        Congela, en una sola transacción, lo que la API lee en ese momento: las filas, el alcance de 27001 y los conteos. La versión es
        inmutable y su número es correlativo por empresa. Responde 409 si queda algún control por decidir (o no hay controles de la norma
        adoptados) y 409 si otra persona aprobó al mismo tiempo. Un control que aplica sin control de la empresa asignado SÍ se puede
        aprobar: queda señalado en el documento. Orden: 401, 403, 409.
      tags: [declaracion]
      x-permiso: declaracion.aprobar
      responses:
        '201':
          description: La versión aprobada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDeclaracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '409':
          $ref: '#/components/responses/Conflicto'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion/versiones:
    get:
      operationId: listarVersionesDeclaracion
      summary: Versiones aprobadas de la declaración
      description: De la más nueva a la más antigua; como máximo las 100 más recientes. Orden de evaluación 401, 403.
      tags: [declaracion]
      x-permiso: declaracion.ver
      responses:
        '200':
          description: Las versiones aprobadas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: '#/components/schemas/VersionDeclaracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion/versiones/{id}:
    get:
      operationId: obtenerVersionDeclaracion
      summary: Una versión aprobada con sus filas congeladas
      description: Una versión de otra empresa responde 404, igual que una inexistente. Orden de evaluación 401, 403, 400, 404.
      tags: [declaracion]
      x-permiso: declaracion.ver
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '200':
          description: La versión con sus filas.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionDeclaracionConFilas'
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion/documento:
    get:
      operationId: exportarBorradorDeclaracion
      summary: Descarga el borrador de la declaración en Word
      description: |
        Siempre como **adjunto**, con el rótulo de documento preliminar. Queda en la bitácora, con la huella SHA-256 del documento,
        **antes** de entregarlo; si no se puede registrar, no se entrega. Orden: 401, 403.
      tags: [declaracion]
      x-permiso: declaracion.exportar
      responses:
        '200':
          description: El documento Word, como adjunto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Content-Disposition:
              description: Siempre `attachment`, con un nombre fijado por el servidor.
              schema:
                type: string
                maxLength: 300
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /declaracion/versiones/{id}/documento:
    get:
      operationId: exportarVersionDeclaracion
      summary: Descarga una versión aprobada de la declaración en Word
      description: |
        Siempre como **adjunto** y SIEMPRE desde la copia congelada de esa versión, no desde los datos de hoy. Queda en la bitácora con la
        huella del documento antes de entregarlo. Una versión de otra empresa responde 404. Orden: 401, 403, 400, 404.
      tags: [declaracion]
      x-permiso: declaracion.exportar
      parameters:
        - $ref: '#/components/parameters/IdRuta'
      responses:
        '200':
          description: El documento Word, como adjunto.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
            Content-Disposition:
              description: Siempre `attachment`, con un nombre fijado por el servidor.
              schema:
                type: string
                maxLength: 300
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ParametrosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de acceso emitido por el sistema de identidad. La empresa sale de su contenido.
  headers:
    CacheControlNoStore:
      description: Las respuestas autenticadas no se guardan en caché (al volver con «atrás» no se muestran datos de una sesión cerrada).
      schema:
        type: string
        enum: [no-store]
    RetryAfter:
      description: Segundos que hay que esperar antes de volver a intentarlo.
      schema:
        type: integer
        minimum: 1
  parameters:
    IdRuta:
      name: id
      in: path
      required: true
      description: Identificador del recurso (UUID en forma canónica; sin llaves ni guiones omitidos).
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        maxLength: 36
  responses:
    NoAutenticado:
      description: Falta el token, está vencido, alterado o no trae empresa.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            codigo: no_autenticado
    SinPermiso:
      description: La persona no tiene permiso para esta acción.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Sin permiso
            status: 403
            codigo: sin_permiso
    NoEncontrado:
      description: |
        El recurso no se puede ver. En el detalle de una entrada: no existe, es de otra empresa o pertenece a una librería que la
        empresa no adoptó; en la adopción: la librería no existe. Los casos son indistinguibles: misma respuesta, mismo cuerpo,
        mismas cabeceras.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No encontrado
            status: 404
            codigo: no_encontrado
    ParametrosInvalidos:
      description: Un parámetro no cumple el formato o los límites indicados. No se repite el valor recibido.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Parámetros no válidos
            status: 400
            codigo: parametro_invalido
    LimiteExcedido:
      description: Demasiadas solicitudes en poco tiempo. Se puede reintentar después de `Retry-After` segundos.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Límite de solicitudes excedido
            status: 429
            codigo: limite_excedido
    Conflicto:
      description: El estado actual no permite la acción (alcance ya aprobado) o otra persona cambió la evaluación mientras se editaba.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Conflicto
            status: 409
            codigo: conflicto
    ArchivoDemasiadoGrande:
      description: El archivo pasa de 25 MB. No se guarda nada y el rechazo queda en la bitácora.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Archivo demasiado grande
            status: 413
            codigo: archivo_demasiado_grande
    LibreriaDemasiadoGrande:
      description: El archivo de la librería pasa de 1 MB. No se lee ni se guarda nada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Archivo demasiado grande
            status: 413
            codigo: archivo_demasiado_grande
    TipoNoPermitido:
      description: |
        El contenido del archivo no es de un tipo permitido o está dañado (PDF, PNG, JPEG, TXT, DOCX, XLSX o PPTX; sin macros, SVG ni HTML).
        El tipo se decide por el contenido, no por la extensión. No se guarda nada y el rechazo queda en la bitácora.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Tipo de archivo no permitido
            status: 415
            codigo: tipo_no_permitido
    ErrorInterno:
      description: Error interno. Si falla el registro en la bitácora de una acción, la acción no se completa y se responde con este error.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Error interno
            status: 500
            codigo: error_interno
  schemas:
    Problema:
      type: object
      description: Error según RFC 9457, deliberadamente cerrado. No lleva `detail` ni campos libres para no filtrar datos de la solicitud.
      required: [type, title, status, codigo]
      additionalProperties: false
      properties:
        type:
          type: string
          const: about:blank
          maxLength: 20
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        codigo:
          type: string
          enum: [no_autenticado, sin_permiso, no_encontrado, parametro_invalido, conflicto, archivo_demasiado_grande, tipo_no_permitido, limite_excedido, error_interno]
    Salud:
      type: object
      required: [status, time]
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
        time:
          type: string
          format: date-time
          maxLength: 40
    EmpresaDePersona:
      type: object
      required: [slug, nombre, activa]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 32
        nombre:
          type: string
          maxLength: 120
        activa:
          type: boolean
          description: Es la empresa de esta sesión ahora.
    EmpresaElegida:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          minLength: 1
          maxLength: 32
    EmpresaActual:
      type: object
      required: [slug, nombre]
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 32
        nombre:
          type: string
          maxLength: 120
    Identidad:
      type: object
      description: La persona que consulta, tomada del token verificado.
      required: [usuarioId, nombre, roles, empresa]
      additionalProperties: false
      properties:
        usuarioId:
          type: string
          format: uuid
          maxLength: 36
          description: Identificador opaco de la cuenta.
        nombre:
          type: string
          maxLength: 120
        roles:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum: [administrador_sig, dueno_proceso, auditor_interno, auditor_externo, colaborador, alta_direccion]
        empresa:
          type: object
          description: La empresa del token. Solo el nombre y el slug (el de la URL `/e/<slug>`); no se expone su identificador interno.
          required: [slug, nombre]
          additionalProperties: false
          properties:
            slug:
              type: string
              pattern: ^[a-z0-9-]+$
              maxLength: 32
            nombre:
              type: string
              maxLength: 120
    Marca:
      type: object
      required: [nombre, colorPrimario, colorOriginal, ajustadoPorContraste, logoUrl]
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 120
        colorPrimario:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
          description: Color que se aplica (ya ajustado si no cumplía el contraste mínimo).
        colorOriginal:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          maxLength: 7
          description: Color configurado por la empresa (es la marca de la propia empresa, no un dato de otra).
        ajustadoPorContraste:
          type: boolean
          description: Verdadero si el color original se ajustó para cumplir el contraste mínimo; el administrador SIG ve un aviso.
        logoUrl:
          type: [string, 'null']
          pattern: ^(https://[A-Za-z0-9.-]+(:[0-9]+)?/[^\s@]*|/[^/\\\s][^\s@]*)$
          maxLength: 2048
          description: Solo `https` sin credenciales en la URL, o una ruta propia (nunca `//host`). Si no es válido se devuelve nulo y se muestra el monograma.
    LibreriaResumen:
      type: object
      required: [id, codigo, nombre, version, esEjemplo, fuente, propia, adoptada]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        nombre:
          type: string
          maxLength: 120
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          maxLength: 20
        esEjemplo:
          type: boolean
          description: Una librería de ejemplo se muestra rotulada como tal.
        fuente:
          type: string
          maxLength: 200
        propia:
          type: boolean
          description: Verdadero si la subió la empresa de quien consulta (ADR 034); falso si es del catálogo global.
        adoptada:
          type: boolean
          description: Si la empresa de quien consulta ya la adoptó.
    LibreriaSubida:
      type: object
      required: [archivo]
      additionalProperties: false
      properties:
        archivo:
          type: string
          format: binary
          description: El YAML de la librería (hasta 1 MB).
    ErrorCargaLibreria:
      type: object
      description: Qué falló y dónde. Nunca repite el contenido del archivo.
      required: [entrada, indice, ruta, codigo]
      additionalProperties: false
      properties:
        entrada:
          type: [string, 'null']
          maxLength: 41
          description: Identificador de la entrada afectada, si aplica.
        indice:
          type: [integer, 'null']
          minimum: 0
          maximum: 999
        ruta:
          type: string
          maxLength: 200
        codigo:
          type: string
          maxLength: 60
    CargaLibreria:
      type: object
      required: [estado, motivo, codigo, version, entradas, huella, errores]
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [cargada, ya_cargada, rechazada]
        motivo:
          type: [string, 'null']
          enum: [tipo_no_permitido, tamano_excedido, formato_invalido, contenido_no_permitido, codigo_no_permitido, hash_distinto, null]
          description: Solo si el estado es `rechazada`.
        codigo:
          type: [string, 'null']
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        version:
          type: [string, 'null']
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          maxLength: 20
        entradas:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
        huella:
          type: string
          pattern: ^[0-9a-f]{64}$
          maxLength: 64
          description: SHA-256 del contenido canónico (si es válida) o de los bytes del archivo (si no).
        errores:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ErrorCargaLibreria'
    Adopcion:
      type: object
      required: [libreriaId, entradas, yaAdoptada, adoptadaEn]
      additionalProperties: false
      properties:
        libreriaId:
          type: string
          format: uuid
          maxLength: 36
        entradas:
          type: integer
          minimum: 0
          description: Cantidad de entradas que quedaron disponibles para la empresa.
        yaAdoptada:
          type: boolean
          description: Verdadero si la librería ya estaba adoptada (respuesta 200, sin cambios).
        adoptadaEn:
          type: string
          format: date-time
          maxLength: 40
    EntradaLibreria:
      type: object
      description: Una entrada (apartado) de una librería adoptada. Una cláusula real puede descomponerse en varios requisitos evaluables.
      required: [id, idEstable, libreriaId, capitulo, nivel, tipo, grupo, titulo, guia, alcanceComun, aplicaA, esEjemplo]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
          description: Identificador estable propio de la librería (no depende de la numeración de una norma).
        libreriaId:
          type: string
          format: uuid
          maxLength: 36
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
          description: Capítulo de la Estructura Armonizada; nulo en un control del Anexo A.
        nivel:
          type: integer
          enum: [1, 2]
        tipo:
          type: string
          enum: [clausula, control]
        grupo:
          type: [string, 'null']
          maxLength: 60
          description: Tema del control del Anexo A; nulo en una cláusula.
        titulo:
          type: string
          maxLength: 80
        guia:
          type: string
          maxLength: 280
        alcanceComun:
          type: string
          enum: [comun, parcial, especifico]
        aplicaA:
          type: array
          minItems: 1
          maxItems: 20
          description: Cláusula que corresponde a la entrada en cada norma y edición (el identificador puede diferir entre normas).
          items:
            type: object
            required: [norma, edicion, clausula]
            additionalProperties: false
            properties:
              norma:
                type: string
                maxLength: 60
              edicion:
                type: string
                pattern: ^[0-9]{4}$
                maxLength: 4
              clausula:
                type: string
                pattern: ^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*$
                maxLength: 20
        esEjemplo:
          type: boolean
          description: Si la librería es de ejemplo, la interfaz lo rotula y remite al ejemplar oficial de la empresa.
    AlcanceNorma:
      type: object
      required: [norma]
      additionalProperties: false
      properties:
        norma:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9 :./-]+$
    AlcanceEntrada:
      type: object
      required: [norma, texto]
      additionalProperties: false
      properties:
        norma:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[A-Za-z0-9 :./-]+$
        texto:
          type: string
          minLength: 1
          maxLength: 4000
    Alcance:
      type: object
      required: [norma, texto, aprobado, aprobadoEn, actualizadoEn]
      additionalProperties: false
      properties:
        norma:
          type: string
          maxLength: 60
        texto:
          type: [string, 'null']
          maxLength: 4000
          description: Nulo mientras el alcance no se haya definido.
        aprobado:
          type: boolean
        aprobadoEn:
          type: [string, 'null']
          format: date-time
          maxLength: 40
        actualizadoEn:
          type: [string, 'null']
          format: date-time
          maxLength: 40
    EstadoEvaluacion:
      type: string
      enum: [cumple, parcial, no_cumple, no_aplica]
    EvaluacionEntrada:
      type: object
      required: [libreriaCodigo, idEstable, estado]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 64
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
          description: Obligatorio (mínimo 5 caracteres) para «no aplica».
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        versionEsperada:
          type: integer
          minimum: 0
    Evaluacion:
      type: object
      required: [libreriaCodigo, idEstable, estado, comentario, responsableId, fechaObjetivo, version]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        version:
          type: integer
          minimum: 1
    EvaluacionVigente:
      type: object
      required: [estado, comentario, fechaObjetivo, version]
      additionalProperties: false
      properties:
        estado:
          $ref: '#/components/schemas/EstadoEvaluacion'
        comentario:
          type: [string, 'null']
          maxLength: 1000
        fechaObjetivo:
          type: [string, 'null']
          format: date
          maxLength: 10
        version:
          type: integer
          minimum: 1
    FilaDiagnostico:
      type: object
      required: [libreriaCodigo, idEstable, tipo, capitulo, grupo, titulo, guia, aplicaA, evaluacion]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        tipo:
          type: string
          enum: [clausula, control]
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
        grupo:
          type: [string, 'null']
          maxLength: 60
        titulo:
          type: string
          maxLength: 80
        guia:
          type: string
          maxLength: 280
        aplicaA:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [norma, edicion, clausula]
            additionalProperties: false
            properties:
              norma: {type: string, maxLength: 60}
              edicion: {type: string, pattern: '^[0-9]{4}$', maxLength: 4}
              clausula: {type: string, pattern: '^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*$', maxLength: 20}
        evaluacion:
          oneOf:
            - $ref: '#/components/schemas/EvaluacionVigente'
            - type: 'null'
          description: Nulo = sin evaluar.
    Desglose:
      type: object
      required: [cumple, parcial, noCumple, noAplica, sinEvaluar, total, porcentaje]
      additionalProperties: false
      properties:
        cumple: {type: integer, minimum: 0}
        parcial: {type: integer, minimum: 0}
        noCumple: {type: integer, minimum: 0}
        noAplica: {type: integer, minimum: 0}
        sinEvaluar: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        porcentaje:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Nulo si no hay nada evaluado que cuente (no es 0).
    MadurezNorma:
      type: object
      required: [norma, desglose]
      additionalProperties: false
      properties:
        norma:
          type: string
          maxLength: 60
        desglose:
          $ref: '#/components/schemas/Desglose'
    MadurezAgrupador:
      type: object
      required: [tipo, nombre, desglose]
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum: [capitulo, tema]
        nombre:
          type: string
          maxLength: 60
          description: Capítulo (por ejemplo «4») o tema del Anexo A.
        desglose:
          $ref: '#/components/schemas/Desglose'
    Madurez:
      type: object
      required: [porNorma, porAgrupador, clausulas]
      additionalProperties: false
      properties:
        porNorma:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MadurezNorma'
        porAgrupador:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MadurezAgrupador'
        clausulas:
          $ref: '#/components/schemas/Desglose'
    Diagnostico:
      type: object
      required: [filas, madurez, normas]
      additionalProperties: false
      properties:
        filas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FilaDiagnostico'
        madurez:
          $ref: '#/components/schemas/Madurez'
        normas:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 60
    EstadoControl:
      type: string
      enum: [vigente, retirado]
    Control:
      type: object
      required: [id, codigo, nombre, descripcion, responsableId, estado, version]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,19}$
          maxLength: 20
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoControl'
        version:
          type: integer
          minimum: 1
    ControlEntrada:
      type: object
      required: [codigo, nombre]
      additionalProperties: false
      properties:
        codigo:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,19}$
          maxLength: 20
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
    ControlCambios:
      type: object
      required: [versionEsperada]
      additionalProperties: false
      properties:
        versionEsperada:
          type: integer
          minimum: 1
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
    ControlVersion:
      type: object
      required: [versionEsperada]
      additionalProperties: false
      properties:
        versionEsperada:
          type: integer
          minimum: 1
    MapeoEntrada:
      type: object
      required: [libreriaCodigo, idEstable]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
          maxLength: 64
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
    MapeoResultado:
      type: object
      required: [libreriaCodigo, idEstable, creado]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        creado:
          type: boolean
          description: Verdadero si se creó (201); falso si ya existía (200).
    EntradaDeMapeo:
      type: object
      required: [tipo, titulo, aplicaA]
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum: [clausula, control]
        titulo:
          type: string
          maxLength: 80
        aplicaA:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [norma, edicion, clausula]
            additionalProperties: false
            properties:
              norma: {type: string, maxLength: 60}
              edicion: {type: string, pattern: '^[0-9]{4}$', maxLength: 4}
              clausula: {type: string, pattern: '^[A-Za-z0-9]+(\.[A-Za-z0-9]+)*$', maxLength: 20}
    MapeoDeControl:
      type: object
      required: [libreriaCodigo, idEstable, entrada]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          maxLength: 64
        idEstable:
          type: string
          maxLength: 41
        entrada:
          oneOf:
            - $ref: '#/components/schemas/EntradaDeMapeo'
            - type: 'null'
          description: Nula si la entrada ya no está entre las librerías que la empresa adoptó.
    ControlMarco:
      type: object
      required: [id, codigo, nombre, descripcion, responsableId, estado, version, mapeos, normas]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoControl'
        version:
          type: integer
          minimum: 1
        mapeos:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MapeoDeControl'
        normas:
          type: array
          maxItems: 20
          description: Normas que alcanza por los mapeos cuyas entradas siguen adoptadas.
          items:
            type: string
            maxLength: 60
    MarcoControles:
      type: object
      required: [controles, normas]
      additionalProperties: false
      properties:
        controles:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ControlMarco'
        normas:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 60
    TipoEvidencia:
      type: string
      enum: [documento, registro]
    EstadoEvidencia:
      type: string
      enum: [activa, reemplazada, eliminada]
    TipoArchivo:
      type: string
      enum:
        - application/pdf
        - image/png
        - image/jpeg
        - text/plain
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
    ArchivoEvidencia:
      type: object
      required: [nombre, tipo, bytes, sha256]
      additionalProperties: false
      properties:
        nombre:
          type: string
          maxLength: 120
          description: Etiqueta normalizada (sin carpetas ni símbolos); en el almacén el archivo es un UUID del servidor.
        tipo:
          $ref: '#/components/schemas/TipoArchivo'
        bytes:
          type: integer
          minimum: 1
          maximum: 26214400
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          maxLength: 64
    Evidencia:
      type: object
      required: [id, controlId, tipo, titulo, fechaHecho, vigenteHasta, estado, reemplazaId, vigente, vencida, creadaEn, archivo]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          maxLength: 36
        controlId:
          type: string
          format: uuid
          maxLength: 36
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        titulo:
          type: string
          maxLength: 120
        fechaHecho:
          type: string
          format: date
          maxLength: 10
        vigenteHasta:
          type: [string, 'null']
          format: date
          maxLength: 10
        estado:
          $ref: '#/components/schemas/EstadoEvidencia'
        reemplazaId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        vigente:
          type: boolean
          description: Activa y con la vigencia al día (fecha de hoy en Ecuador).
        vencida:
          type: boolean
          description: Activa pero con la vigencia ya pasada.
        creadaEn:
          type: string
          format: date-time
          maxLength: 40
        archivo:
          $ref: '#/components/schemas/ArchivoEvidencia'
    EvidenciaSubida:
      type: object
      description: Los campos de texto van antes del archivo.
      required: [tipo, titulo, fechaHecho, archivo]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        fechaHecho:
          type: string
          format: date
          maxLength: 10
          description: El día en que ocurrió lo que la evidencia demuestra; no puede ser futuro.
        vigenteHasta:
          type: string
          format: date
          maxLength: 10
          description: Opcional; no anterior a la fecha del hecho.
        archivo:
          type: string
          format: binary
    EvidenciaReemplazo:
      type: object
      description: Los campos de texto van antes del archivo.
      required: [fechaHecho, archivo]
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/TipoEvidencia'
        titulo:
          type: string
          minLength: 1
          maxLength: 120
        fechaHecho:
          type: string
          format: date
          maxLength: 10
        vigenteHasta:
          type: string
          format: date
          maxLength: 10
        archivo:
          type: string
          format: binary
    AplicabilidadDeclaracion:
      type: string
      enum: [aplica, no_aplica, por_decidir]
    FilaDeclaracion:
      type: object
      required: [libreriaCodigo, idEstable, orden, titulo, grupo, aplicabilidad, implementacion, justificacion, controles, cobertura]
      additionalProperties: false
      properties:
        libreriaCodigo: {type: string, maxLength: 64}
        idEstable: {type: string, maxLength: 41}
        orden: {type: integer, minimum: 0}
        titulo: {type: string, maxLength: 200}
        grupo: {type: [string, 'null'], maxLength: 80}
        aplicabilidad:
          $ref: '#/components/schemas/AplicabilidadDeclaracion'
        implementacion:
          type: [string, 'null']
          maxLength: 20
          description: 'implementado, parcial o no_implementado; nula si no aplica o está por decidir.'
        justificacion:
          type: [string, 'null']
          maxLength: 1000
          description: Solo si no aplica; es la que la empresa escribió al evaluar.
        controles:
          type: array
          maxItems: 50
          items: {type: string, maxLength: 20}
          description: Códigos de los controles vigentes de la empresa que la cubren.
        cobertura:
          $ref: '#/components/schemas/EstadoCobertura'
    ResumenDeclaracion:
      type: object
      required: [total, aplican, noAplican, porDecidir, sinControl, aprobable]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        aplican: {type: integer, minimum: 0}
        noAplican: {type: integer, minimum: 0}
        porDecidir: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0, description: Aplican y ningún control de la empresa los cubre; no impide aprobar.}
        aprobable: {type: boolean, description: Hay filas y ninguna está por decidir.}
    VersionDeclaracion:
      type: object
      required: [id, numero, total, aplican, noAplican, sinControl, aprobadaPor, aprobadaEn]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        numero: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        aplican: {type: integer, minimum: 0}
        noAplican: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        aprobadaPor: {type: string, format: uuid, maxLength: 36}
        aprobadaEn: {type: string, format: date-time, maxLength: 40}
    VersionDeclaracionConFilas:
      type: object
      required: [id, numero, total, aplican, noAplican, sinControl, aprobadaPor, aprobadaEn, alcance, filas]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid, maxLength: 36}
        numero: {type: integer, minimum: 1}
        total: {type: integer, minimum: 0}
        aplican: {type: integer, minimum: 0}
        noAplican: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        aprobadaPor: {type: string, format: uuid, maxLength: 36}
        aprobadaEn: {type: string, format: date-time, maxLength: 40}
        alcance:
          type: [string, 'null']
          maxLength: 4000
          description: El alcance de la norma tal como estaba al aprobar.
        filas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FilaDeclaracion'
    Declaracion:
      type: object
      required: [norma, hoy, resumen, filas, alcance, ultimaVersion]
      additionalProperties: false
      properties:
        norma: {type: string, maxLength: 60}
        hoy:
          type: string
          format: date
          maxLength: 10
          description: La fecha de hoy en Ecuador con la que se calculó la cobertura.
        resumen:
          $ref: '#/components/schemas/ResumenDeclaracion'
        filas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/FilaDeclaracion'
        alcance:
          type: [object, 'null']
          required: [texto, aprobado]
          additionalProperties: false
          description: El alcance de la norma tal como está hoy (aprobado o no); nulo si no se definió.
          properties:
            texto: {type: string, maxLength: 4000}
            aprobado: {type: boolean}
        ultimaVersion:
          type: [object, 'null']
          required: [id, numero, total, aplican, noAplican, sinControl, aprobadaPor, aprobadaEn]
          additionalProperties: false
          description: La última versión aprobada; nula si todavía no hay ninguna.
          properties:
            id: {type: string, format: uuid, maxLength: 36}
            numero: {type: integer, minimum: 1}
            total: {type: integer, minimum: 0}
            aplican: {type: integer, minimum: 0}
            noAplican: {type: integer, minimum: 0}
            sinControl: {type: integer, minimum: 0}
            aprobadaPor: {type: string, format: uuid, maxLength: 36}
            aprobadaEn: {type: string, format: date-time, maxLength: 40}
    EstadoCobertura:
      type: string
      enum: [cubierta, evidencia_vencida, sin_evidencia, sin_control, no_aplica]
    ResumenCobertura:
      type: object
      required: [total, cubiertas, evidenciaVencida, sinEvidencia, sinControl, porcentaje]
      additionalProperties: false
      properties:
        total: {type: integer, minimum: 0}
        cubiertas: {type: integer, minimum: 0}
        evidenciaVencida: {type: integer, minimum: 0}
        sinEvidencia: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        porcentaje:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Nulo si no hay ninguna entrada a la que pedir cobertura (no es 0).
    CoberturaNorma:
      type: object
      required: [norma, total, cubiertas, evidenciaVencida, sinEvidencia, sinControl, porcentaje]
      additionalProperties: false
      properties:
        norma: {type: string, maxLength: 60}
        total: {type: integer, minimum: 0}
        cubiertas: {type: integer, minimum: 0}
        evidenciaVencida: {type: integer, minimum: 0}
        sinEvidencia: {type: integer, minimum: 0}
        sinControl: {type: integer, minimum: 0}
        porcentaje:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
    CoberturaEntrada:
      type: object
      required: [libreriaCodigo, idEstable, tipo, capitulo, grupo, titulo, normas, estado, controles, evidencias]
      additionalProperties: false
      properties:
        libreriaCodigo: {type: string, maxLength: 64}
        idEstable: {type: string, maxLength: 41}
        tipo:
          type: string
          enum: [clausula, control]
        capitulo:
          type: [integer, 'null']
          minimum: 4
          maximum: 10
        grupo:
          type: [string, 'null']
          maxLength: 60
        titulo: {type: string, maxLength: 80}
        normas:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 60}
        estado:
          $ref: '#/components/schemas/EstadoCobertura'
        controles:
          type: integer
          minimum: 0
          description: Controles vigentes que la cubren por un mapeo.
        evidencias:
          type: integer
          minimum: 0
          description: Evidencias activas de esos controles (vigentes o no).
    Cobertura:
      type: object
      required: [hoy, entradas, porNorma, total, normas]
      additionalProperties: false
      properties:
        hoy:
          type: string
          format: date
          maxLength: 10
          description: La fecha de hoy en Ecuador con la que se calculó el vencimiento.
        entradas:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CoberturaEntrada'
        porNorma:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CoberturaNorma'
        total:
          $ref: '#/components/schemas/ResumenCobertura'
        normas:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 60}
