      properties:
        versionId:
          type: string
          format: uuid
          maxLength: 36
        documentoId:
          type: string
          format: uuid
          maxLength: 36
        codigo:
          type: string
          maxLength: 10
          pattern: ^[A-Z]{3}-[0-9]{3,6}$
        titulo:
          type: string
          maxLength: 120
        numeroVersion:
          type: integer
          minimum: 1
    CoberturaDocumental:
      type: object
      description: 'Informativa: no bloquea nada. Solo cuenta documentos con versión vigente.'
      required:
      - normas
      - total
      - cubiertas
      - entradas
      additionalProperties: false
      properties:
        normas:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 60
        total:
          type: integer
          minimum: 0
        cubiertas:
          type: integer
          minimum: 0
        entradas:
          type: array
          maxItems: 500
          items:
            type: object
            required:
            - libreriaCodigo
            - idEstable
            - tipo
            - titulo
            - normas
            - documentos
            - cubierta
            additionalProperties: false
            properties:
              libreriaCodigo:
                type: string
                maxLength: 64
              idEstable:
                type: string
                maxLength: 41
              tipo:
                type: string
                enum:
                - clausula
                - control
              titulo:
                type: string
                maxLength: 200
              normas:
                type: array
                maxItems: 20
                items:
                  type: string
                  maxLength: 60
              documentos:
                type: array
                maxItems: 50
                items:
                  type: object
                  required:
                  - id
                  - codigo
                  additionalProperties: false
                  properties:
                    id:
                      type: string
                      format: uuid
                      maxLength: 36
                    codigo:
                      type: string
                      maxLength: 10
                      pattern: ^[A-Z]{3}-[0-9]{3,6}$
              cubierta:
                type: boolean
