  /cobertura:
    get:
      operationId: obtenerCobertura
      summary: Cobertura documental de las entradas de las normas adoptadas
      description: |
        Para cada entrada que no se evaluó como «no aplica»: cubierta (algún control vigente que la cubre tiene una evidencia activa y
        vigente), evidencia vencida, sin evidencia o sin control. Se resume por norma. Mide la cobertura documental, no la eficacia de
        los controles. Orden de evaluación: 401, 403, 400.
      tags: [evidencias]
      x-permiso: evidencias.ver
      parameters:
        - name: norma
          in: query
          required: false
          description: Solo las entradas que aplican a esta norma.
          schema:
            type: string
            minLength: 1
            maxLength: 60
            pattern: ^[A-Za-z0-9 :./-]+$
      responses:
        '200':
          description: La cobertura.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cobertura'
