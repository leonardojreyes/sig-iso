          maxLength: 36
        codigo:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,19}$
          maxLength: 20
        nombre:
          type: string
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
        estado:
          $ref: '#/components/schemas/EstadoControl'
        version:
          type: integer
          minimum: 1
    ControlEntrada:
      type: object
      required: [codigo, nombre]
      additionalProperties: false
      properties:
        codigo:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,19}$
          maxLength: 20
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
    ControlCambios:
      type: object
      required: [versionEsperada]
      additionalProperties: false
      properties:
        versionEsperada:
          type: integer
          minimum: 1
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: [string, 'null']
          maxLength: 1000
        responsableId:
          type: [string, 'null']
          format: uuid
          maxLength: 36
    ControlVersion:
      type: object
      required: [versionEsperada]
      additionalProperties: false
      properties:
        versionEsperada:
          type: integer
          minimum: 1
    MapeoEntrada:
      type: object
      required: [libreriaCodigo, idEstable]
      additionalProperties: false
      properties:
        libreriaCodigo:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
          maxLength: 64
        idEstable:
          type: string
          pattern: ^[a-z0-9][a-z0-9.-]{0,40}$
          maxLength: 41
    MapeoResultado:
      type: object
