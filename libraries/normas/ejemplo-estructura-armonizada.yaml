# BORRADOR — NUMERACIONES SIN VERIFICAR (pregunta Q7 del spec del corte 0.6).
#
# Librería de ejemplo de la Estructura Armonizada. Es una librería SINTÉTICA de elaboración propia: no es la norma ni su texto
# (regla 3 del proyecto). Las guías están redactadas con palabras de SynapTech. Los títulos son breves, y VARIOS COINCIDEN con
# los nombres usuales de las cláusulas: su uso está pendiente de decisión del responsable (ver verificacion-numeraciones.md).
#
# Las numeraciones de cada norma salen de memoria de `experto-iso` y DEBEN comprobarse contra los ejemplares vigentes antes de
# publicar la librería. Lista de comprobación: docs/specs/corte-vertical-0-6/verificacion-numeraciones.md
#
# alcance_comun: `comun` = el tema y lo esencial son equivalentes en las tres normas; `parcial` = el tema existe en las tres pero
# su contenido de fondo o su detalle difiere de forma relevante; `especifico` = solo existe en una norma.
#
# Al verificar: subir `version` a 1.0.0 y QUITAR este bloque de comentarios (una prueba exige que «borrador» y «sin verificar»
# vayan juntos).
#
# Decisión del responsable (2026-11-08): sin los ejemplares a la mano, esta versión 0.1.0 se carga SOLO como ejemplo en la base local de
# desarrollo (`pnpm libraries:load`), con el aviso en el nombre. No se usa como si fuera la norma. Al verificar las numeraciones se
# publica la versión siguiente (las versiones cargadas son inmutables).
esquema: 2
